function SheetHost({ sheet, close, s, act, go, toast, notify, actions }){
  if (!sheet) return null;
  const { kind, data } = sheet;
  if (kind==='notifs') return html`<${Sheet} title="Benachrichtigungen" onClose=${close}>
    <div className="stack g8">${s.notifications.length===0 && html`<p className="muted">Noch nichts Neues. Push-Nachrichten erscheinen hier und später auch auf dem Sperrbildschirm.</p>`}
    ${[...s.notifications].reverse().slice(0,30).map(n=> html`<div key=${n.id} className="panel row g10" style=${{ padding:12 }}><span className="muted" style=${{ flex:'none' }}><${Icon} n="bell" s=${18}/></span><span className="small grow">${n.text}</span><span className="tiny muted">${n.time}</span></div>`)}</div>
  <//>`;
  if (kind==='filters') return html`<${FilterSheet} close=${close} s=${s} act=${act} data=${data} actions=${actions}/>`;
  if (kind==='feedback') return html`<${FeedbackSheet} close=${close} s=${s} actions=${actions} toast=${toast} data=${data}/>`;
  if (kind==='idcheck') return html`<${IdCheckSheet} close=${close} act=${act} toast=${toast} after=${data.after} actions=${actions} data=${data}/>`;
  if (kind==='report') return html`<${ReportSheet} close=${close} s=${s} act=${act} toast=${toast} listingId=${data.listingId}/>`;
  if (kind==='pay') return html`<${PaySheet} close=${close} s=${s} actions=${actions} data=${data}/>`;
  if (kind==='rentpay') return html`<${RentPaySheet} close=${close} s=${s} actions=${actions} data=${data}/>`;
  if (kind==='legal') return html`<${Sheet} title=${(LEGAL[data.id] || LEGAL.agb).title} onClose=${close}><${LegalBody} id=${data.id} openLegal=${actions.openLegal}/><//>`;
  if (kind==='decline') return html`<${Sheet} title="Angebot ablehnen?" onClose=${close}><div className="stack g12"><p className="muted">Du kannst danach im Chat weiter verhandeln.</p><button className="btn" onClick=${()=>{ actions.declineOffer(data.threadId, data.msgId); close(); }}>Ablehnen</button><button className="btn ghost" onClick=${close}>Zurück</button></div><//>`;
  if (kind==='dispute') return html`<${DisputeSheet} close=${close} act=${act} toast=${toast} orderId=${data.orderId} rental=${data.rental}/>`;
  if (kind==='cancel') return html`<${Sheet} title="Wirklich stornieren?" onClose=${close}><div className="stack g12"><p className="muted">Bis 24 Stunden vor dem Termin bekommst du den vollen Betrag zurück, ohne einen Grund zu nennen. In der Testversion geht das jederzeit.</p>
    <button className="btn danger" onClick=${()=>{ act(st=>{ const o = st.orders.find(x=>x.id===data.orderId); return { ...st, orders: st.orders.map(x=>x.id===data.orderId?{ ...x, status:'refunded' }:x),
      listings: o && (o.slotKey || o.dayKeys) ? st.listings.map(l=>l.id===o.listingId ? { ...l, booked:(l.booked||[]).filter(k=>k!==o.slotKey && !(o.dayKeys||[]).includes(k)) } : l) : st.listings }; }); toast('Storniert. Das Geld wird zurückgebucht und der Termin ist wieder frei.', 'ok'); close(); }}>Ja, stornieren</button><button className="btn ghost" onClick=${close}>Nein, behalten</button></div><//>`;
  if (kind==='stripe') return html`<${Sheet} title="Auszahlungen einrichten" onClose=${close}><div className="stack g16">
    <p style=${{ color:'var(--ink-2)' }}>Bevor du Geld bekommen kannst, bestätigt unser Zahlungspartner einmalig deine Identität und dein Bankkonto. Das ist gesetzlich vorgeschrieben. Danach hast du automatisch das grüne Schild „Identität geprüft“.</p>
    <div className="box b-butter"><${Icon} n="alert"/><span>Testmodus: Hier würde sich das sichere Formular von Stripe öffnen. Du gibst in dieser Testversion keine echten Daten ein.</span></div>
    ${s.user.idVerified ? html`<button className="btn" onClick=${()=>{ act(st=>({ ...st, stripeReady:true })); toast('Auszahlungen sind eingerichtet (Test).', 'ok'); actions.reopen('sendoffer', data); }}>Bankkonto testweise bestätigen</button>`
      : html`<button className="btn" onClick=${()=>actions.reopen('idcheck', { ...data, after:'stripe' })}>Identität prüfen und weiter</button>`}
  </div><//>`;
  if (kind==='sendoffer') return html`<${SendOfferSheet} close=${close} s=${s} actions=${actions} threadId=${data.threadId}/>`;
  if (kind==='share') return html`<${ShareSheet} close=${close} s=${s} act=${act} toast=${toast} go=${go} data=${data} notify=${notify}/>`;
  if (kind==='safety') return html`<${Sheet} title="Ist alles in Ordnung?" onClose=${close}><div className="stack g12">
    <p style=${{ color:'var(--ink-2)' }}>Dein Termin dauert länger als geplant. Wir fragen nach, um sicherzugehen.</p>
    <button className="btn" onClick=${()=>{ act(st=>({ ...st, orders: st.orders.map(o=>o.id===data.orderId?{ ...o, extended:(o.extended||0)+30 }:o) })); toast('Alles klar. Wir fragen in 30 Minuten noch einmal.', 'ok'); close(); }}>Alles gut, dauert nur länger</button>
    <button className="btn sos" onClick=${()=>actions.reopen('sos', data)}><${Icon} n="sos" s=${20}/>Ich brauche Hilfe</button>
    <button className="testbtn" onClick=${()=>{ actions.noAnswer(data.orderId); close(); }}><${Icon} n="fast" s=${18}/>Testmodus: Keine Antwort nach 10 Minuten</button>
  </div><//>`;
  if (kind==='sos') return html`<${SosSheet} close=${close} s=${s} actions=${actions} data=${data} toast=${toast}/>`;
  if (kind==='chatmenu') { const t = s.threads.find(x=>x.id===data.threadId); if (!t) return null; const bl = s.blocked.includes(t.otherId);
    return html`<${Sheet} title=${t.otherName} onClose=${close}><div className="stack g12"><div className="panel">
      <button className="listrow" onClick=${()=>{ close(); go({ name:'listing', id:t.listingId }); }}><${Icon} n="list" s=${20}/><span className="grow">Inserat ansehen</span></button>
      <button className="listrow" onClick=${()=>{ act(st=>({ ...st, reports:[...st.reports, { id:uid(), listingId:t.listingId, reason:'Problem im Chat', note:'Gemeldet aus dem Chat mit ' + t.otherName, status:'open', by:st.user.name }] })); toast('Danke. Wir sehen uns das so schnell wie möglich an.', 'ok'); close(); }}><${Icon} n="flag" s=${20}/><span className="grow">Melden</span></button>
      <button className="listrow" style=${{ color:'var(--danger)' }} onClick=${()=>{ act(st=>({ ...st, blocked: bl ? st.blocked.filter(x=>x!==t.otherId) : [...st.blocked, t.otherId] })); toast(bl ? t.otherName + ' ist nicht mehr blockiert.' : t.otherName + ' ist blockiert. Ihr könnt euch nicht mehr schreiben.', 'ok'); close(); }}><${Icon} n="ban" s=${20}/><span className="grow">${bl ? 'Blockierung aufheben' : 'Blockieren'}</span></button>
    </div>
    <button className="testbtn" onClick=${()=>{ actions.simHarass(t.id); close(); }}><${Icon} n="fast" s=${18}/>Testmodus: unangemessene Nachricht empfangen</button>
    </div><//>`; }
  if (kind==='blocked') return html`<${Sheet} title="Blockierte Personen" onClose=${close}><div className="stack g8">
    ${s.blocked.length===0 && html`<p className="muted">Du hast niemanden blockiert.</p>`}
    ${s.blocked.map(b=>{ const t = s.threads.find(x=>x.otherId===b); const l = s.listings.find(x=>x.provider.id===b); const name = (t && t.otherName) || (l && l.provider.name) || 'Person';
      return html`<div key=${b} className="panel row g10" style=${{ padding:12 }}><${Avatar} name=${name} size=${40}/><span className="grow" style=${{ fontWeight:600 }}>${name}</span><button className="btn outline sm" onClick=${()=>act(st=>({ ...st, blocked: st.blocked.filter(x=>x!==b) }))}>Aufheben</button></div>`; })}
  </div><//>`;
  if (kind==='limit') return html`<${Sheet} title="Tageslimit erreicht" onClose=${close}><div className="stack g12">
    <p style=${{ color:'var(--ink-2)' }}>Neue Konten können ${data.limit} neue Anfragen am Tag senden. So schützen wir alle vor Spam und Fake-Konten.</p>
    ${!s.user.idVerified && html`<button className="btn" onClick=${()=>actions.reopen('idcheck', {})}>Identität prüfen: bis zu 20 am Tag</button>`}
    <button className="btn ghost" onClick=${close}>Verstanden</button></div><//>`;
  if (kind==='restricted') return html`<${Sheet} title=${data.title} onClose=${close}><div className="stack g12">
    <p style=${{ color:'var(--ink-2)' }}>${data.text}</p>
    ${data.idcheck && html`<button className="btn" onClick=${()=>actions.reopen('idcheck', { after:'chat', listingId:data.listingId })}>Identität jetzt prüfen</button>`}
    <button className="btn ghost" onClick=${close}>Andere Angebote ansehen</button></div><//>`;
  if (kind==='logout') return html`<${Sheet} title="Abmelden?" onClose=${close}><div className="stack g12">
    <p className="muted">Deine Inserate, Chats und Aufträge bleiben gespeichert. Du meldest dich einfach wieder mit ${s.user.phone} an.</p>
    <button className="btn" onClick=${()=>{ act(st=>({ ...st, account:st.user, user:null })); close(); go({ name:'home' }, true); }}>Abmelden</button>
    <button className="btn ghost" onClick=${close}>Abbrechen</button></div><//>`;
  if (kind==='dellisting') { const l = s.listings.find(x=>x.id===data.id); if (!l) return null;
    const open = s.orders.filter(o=>o.listingId===l.id && (o.status==='held' || o.status==='due' || o.status==='disputed')).length;
    return html`<${Sheet} title="Inserat löschen?" onClose=${close}><div className="stack g12">
      ${open ? html`<div className="box b-danger"><${Icon} n="alert"/><span>Zu „${l.title}“ gibt es noch ${open} offene ${open===1 ? 'Buchung' : 'Buchungen'}. Schließe sie zuerst ab. Neue Buchungen verhinderst du, indem du das Inserat pausierst.</span></div>`
        : html`<${React.Fragment}><p className="muted">„${l.title}“ wird endgültig gelöscht. Bewertungen dazu gehen verloren.</p><button className="btn danger" onClick=${()=>{ act(x=>({ ...x, listings: x.listings.filter(y=>y.id!==l.id) })); close(); toast('Inserat gelöscht.', 'ok'); }}>Endgültig löschen</button><//>`}
      <button className="btn ghost" onClick=${close}>Abbrechen</button></div><//>`; }
  if (kind==='reset') return html`<${Sheet} title="Testdaten zurücksetzen?" onClose=${close}><div className="stack g12"><p className="muted">Alle Chats, Aufträge und eigenen Inserate werden gelöscht. Dein Konto bleibt.</p>
    <button className="btn" onClick=${()=>{ act(st=>withName(seed(), st.user)); close(); go({ name:'home' }, true); toast('Testversion zurückgesetzt.', 'ok'); }}>Zurücksetzen</button><button className="btn ghost" onClick=${close}>Abbrechen</button></div><//>`;
  if (kind==='delete') return html`<${Sheet} title="Konto wirklich löschen?" onClose=${close}><div className="stack g12">
    <p style=${{ color:'var(--ink-2)' }}>Dein Profil, deine Inserate, Chats und Ausweisdaten werden gelöscht. Offene Aufträge müssen vorher abgeschlossen sein. Bewertungen, die du geschrieben hast, bleiben anonym erhalten.</p>
    ${s.orders.some(o=>o.status==='held'||o.status==='due'||o.status==='disputed') ? html`<div className="box b-danger"><${Icon} n="alert"/><span>Du hast noch offene Aufträge. Schließe sie zuerst ab oder storniere sie.</span></div>`
      : html`<button className="btn danger" onClick=${()=>{ act(()=>seed()); close(); }}>Konto endgültig löschen</button>`}
    <button className="btn ghost" onClick=${close}>Abbrechen</button></div><//>`;
  return null;
}

function Group({ title, sub, children }){ return html`<div className="stack g8"><div className="stack" style=${{ gap:2 }}><span className="label">${title}</span>${sub && html`<span className="tiny muted">${sub}</span>`}</div>${children}</div>`; }
function FOpt({ F, set, k, v, label, icon, disabled }){ return html`<button className="chip" aria-pressed=${F[k]===v} disabled=${disabled} style=${{ opacity: disabled ? .5 : 1 }} onClick=${()=>set(k, v)}>${icon && html`<${Icon} n=${icon} s=${16}/>`}${label}</button>`; }
function FeedbackSheet({ close, s, actions, toast, data }){
  const [kind, setKind] = useState(''); const [text, setText] = useState(''); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false); const [fallback, setFallback] = useState(null);
  const kinds = [['gut','Gefällt mir','heart'],['idee','Idee','star'],['problem','Problem','alert']];
  async function send(){
    if (!kind) { setErr('Wähle aus, worum es geht.'); return; }
    if (text.trim().length < 5) { setErr('Schreib bitte ein paar Worte dazu.'); return; }
    setBusy(true);
    const ok = await actions.sendFeedback({ kind, text:text.trim(), screen:data.screen || '' });
    setBusy(false);
    actions.feedbackSent();
    if (ok) { toast('Danke! Dein Feedback ist angekommen.', 'ok'); close(); return; }
    setFallback('Neighbr-Feedback · ' + kinds.find(k=>k[0]===kind)[1] + (data.screen ? ' · bei ' + data.screen : '') + '\n' + text.trim());
  }
  if (fallback) return html`<${Sheet} title="Feedback weiterschicken" onClose=${close}><div className="stack g12">
    <p style=${{ color:'var(--ink-2)' }}>Diese Ansicht kann nichts in die gemeinsame Testwelt speichern. Kopier dein Feedback und schick es an die Person, die dir den Link geschickt hat.</p>
    <div className="code">${fallback}</div>
    <button className="btn" onClick=${()=>copyText(fallback, toast)}><${Icon} n="copy" s=${18}/>Text kopieren</button>
    <button className="btn ghost" onClick=${close}>Fertig</button>
  </div><//>`;
  return html`<${Sheet} title="Feedback geben" onClose=${busy ? ()=>{} : close}><div className="stack g16">
    <p className="small muted">Alles hilft: was dir gefällt, was fehlt, wo du hängen geblieben bist.${data.screen ? ' Wir merken uns, dass du gerade bei „' + data.screen + '“ warst.' : ''}</p>
    <div className="row g8 wrap" role="group" aria-label="Worum geht es?">
      ${kinds.map(([v,t,ic])=> html`<button key=${v} className="chip" aria-pressed=${kind===v} onClick=${()=>{ setKind(v); setErr(''); }}><${Icon} n=${ic} s=${16}/>${t}</button>`)}
    </div>
    <div className="field"><label htmlFor="fbtext">Dein Feedback</label>
      <textarea id="fbtext" className="input" maxLength="1500" placeholder="z. B. Beim Buchen war mir nicht klar, wann ich bezahle." value=${text} onChange=${e=>{ setText(e.target.value); setErr(''); }}></textarea></div>
    ${err && html`<p className="err" role="alert">${err}</p>`}
    <button className="btn" disabled=${busy} onClick=${send}>${busy ? 'Wird gesendet …' : 'Feedback senden'}</button>
  </div><//>`;
}

function FilterSheet({ close, s, act, data, actions }){
  const [F, setF] = useState({ ...DEF_F, ...(s.filters||{}) });
  const [radius, setRadius] = useState(s.radius); const [onlyIdv, setOnlyIdv] = useState(s.onlyIdv);
  const set = (k,v) => setF(x=>({ ...x, [k]:v }));
  const count = filterListings(s, F, radius, onlyIdv, data.q, data.c).length;
  const canGender = s.user.idVerified;
  const Opt = ({ k, v, label, icon, disabled }) => html`<${FOpt} F=${F} set=${set} k=${k} v=${v} label=${label} icon=${icon} disabled=${disabled}/>`;
  function apply(){ act(st=>({ ...st, radius, onlyIdv, filters:F })); close(); }
  return html`<${Sheet} title="Filter" onClose=${close}><div className="stack g20">
    <${Group} title="Wer bietet an?" sub=${canGender ? 'Berücksichtigt nur Personen mit geprüfter Identität, weil nur dort das Geschlecht bestätigt ist.' : 'Diesen Filter können nur Personen mit geprüfter Identität nutzen. So bleibt nachvollziehbar, wer ihn verwendet.'}>
      <div className="row g8 wrap">
        <${Opt} k="gender" v="alle" label="Alle"/>
        <${Opt} k="gender" v="w" label="Nur Frauen" icon="venus" disabled=${!canGender}/>
        <${Opt} k="gender" v="m" label="Nur Männer" icon="mars" disabled=${!canGender}/>
      </div>
      ${!canGender && html`<button className="btn ghost sm" style=${{ alignSelf:'flex-start' }} onClick=${()=>actions.reopen('idcheck', {})}>Identität prüfen</button>`}
      <div className="panel"><${Switch} id="f-idv" label="Nur geprüfte Identität" sub="Blendet Konten ohne Ausweis-Check aus" on=${onlyIdv} onToggle=${()=>setOnlyIdv(!onlyIdv)}/></div>
    <//>
    <${Group} title="Preis">
      ${s.browse!=='rental' && html`<div className="row g8 wrap"><${Opt} k="unit" v="alle" label="Alle Preisarten"/><${Opt} k="unit" v="Std." label="Pro Stunde"/><${Opt} k="unit" v="pauschal" label="Pauschal"/></div>`}
      ${s.browse==='rental' && html`<span className="tiny muted">Preis pro Tag</span>`}
      <div className="row g10">
        <div className="field grow"><label htmlFor="pmin" className="small">Von (€)</label><input id="pmin" className="input" inputMode="decimal" placeholder="0" value=${F.priceMin} onChange=${e=>set('priceMin', e.target.value)}/></div>
        <div className="field grow"><label htmlFor="pmax" className="small">Bis (€)</label><input id="pmax" className="input" inputMode="decimal" placeholder="egal" value=${F.priceMax} onChange=${e=>set('priceMax', e.target.value)}/></div>
      </div>
      <div className="row g8 wrap">${[['bis 10 €','',10],['10–20 €',10,20],['20–40 €',20,40],['über 40 €',40,'']].map(([t,a,b])=> html`<button key=${t} className="chip" style=${{ height:34, fontSize:13 }} aria-pressed=${String(F.priceMin)===String(a) && String(F.priceMax)===String(b)} onClick=${()=>setF(x=>({ ...x, priceMin:String(a), priceMax:String(b) }))}>${t}</button>`)}</div>
    <//>
    <${Group} title="Verfügbarkeit" sub=${s.browse==='rental' ? 'Zeigt nur Gegenstände, die an diesen Tagen frei sind' : 'Gilt für Inserate mit festen Zeiten'}>
      <div className="row g8 wrap"><${Opt} k="avail" v="alle" label="Egal"/><${Opt} k="avail" v="direkt" label="Direkt buchbar" icon="clock"/><${Opt} k="avail" v="woche" label="Frei in 7 Tagen"/><${Opt} k="avail" v="wochenende" label="Frei am Wochenende"/></div>
      <span className="small" style=${{ fontWeight:600 }}>An bestimmten Tagen frei</span>
      <div className="row g6 wrap" role="group" aria-label="Wochentage">${WD_ORDER.map(d=> html`<button key=${d} className="chip" style=${{ minWidth:46, justifyContent:'center', padding:'0 10px' }} aria-pressed=${F.days.includes(d)} onClick=${()=>set('days', F.days.includes(d) ? F.days.filter(x=>x!==d) : [...F.days, d])}>${WD[d]}</button>`)}</div>
    <//>
    <${Group} title="Bewertung">
      <div className="row g8 wrap"><${Opt} k="minRating" v=${0} label="Egal"/><${Opt} k="minRating" v=${4} label="ab ★ 4"/><${Opt} k="minRating" v=${4.5} label="ab ★ 4,5"/></div>
    <//>
    <${Group} title="Umkreis">
      <div className="row g8 wrap">${[2,5,10,25,50].map(r=> html`<button key=${r} className="chip" aria-pressed=${radius===r} onClick=${()=>setRadius(r)}><${Icon} n="pin" s=${15}/>${r} km</button>`)}</div>
    <//>
    <${Group} title="Sortieren nach">
      <div className="row g8 wrap"><${Opt} k="sort" v="nah" label="Entfernung"/><${Opt} k="sort" v="preis" label="Preis"/><${Opt} k="sort" v="bewertung" label="Bewertung"/></div>
    <//>
    <div className="row g8" style=${{ position:'sticky', bottom:-22, background:'var(--bg)', paddingBlock:'10px 4px' }}>
      <button className="btn outline" style=${{ width:'auto', flex:'none' }} onClick=${()=>{ setF({ ...DEF_F }); setRadius(10); setOnlyIdv(false); }}>Zurücksetzen</button>
      <button className="btn grow" onClick=${apply}>${count} ${count===1 ? 'Angebot' : 'Angebote'} anzeigen</button>
    </div>
  </div><//>`;
}

function IdCheckSheet({ close, act, toast, after, actions, data }){
  const [step, setStep] = useState(0); const [consent, setConsent] = useState(false); const [err, setErr] = useState(''); const [gender, setGender] = useState('');
  const steps = ['Einwilligung','Ausweis','Selfie','Fertig'];
  function finish(){
    if (!gender) { setErr('Bitte wähle aus, was im Testausweis stehen soll.'); return; }
    act(st=>({ ...withName(st, { ...st.user, idVerified:true, gender }), hideIdBanner:true }));
    toast('Identität geprüft. Du hast jetzt das grüne Schild.', 'ok');
    if (after==='stripe') actions.reopen('stripe', data);
    else if (after==='chat' && data.listingId) { close(); actions.retryChat(data.listingId); }
    else close();
  }
  return html`<${Sheet} title="Identität prüfen" onClose=${close}><div className="stack g16">
    <div className="row g6">${steps.map((t,i)=> html`<div key=${t} className="stack g4 grow"><div style=${{ height:4, borderRadius:2, background: i<=step ? 'var(--accent)' : 'var(--line-strong)' }}></div><span className="tiny" style=${{ color: i===step ? 'var(--ink)' : 'var(--muted)', fontWeight: i===step ? 600 : 400 }}>${t}</span></div>`)}</div>
    ${step===0 && html`<div className="stack g12">
      <p style=${{ color:'var(--ink-2)' }}>Du fotografierst deinen Ausweis und machst ein kurzes Selfie. Unser Partner Stripe Identity gleicht beides ab. Neighbr speichert nur das Ergebnis, deinen Vornamen und das Geschlecht aus dem Ausweis, nie das Ausweisfoto.</p>
      <div className="panel stack g8" style=${{ padding:14 }}>
        <div className="idstep"><${Icon} n="check" s=${18}/>Grünes Schild „Identität geprüft“ bei deinem Namen</div>
        <div className="idstep"><${Icon} n="check" s=${18}/>Bis zu 20 neue Anfragen am Tag statt 5</div>
        <div className="idstep"><${Icon} n="check" s=${18}/>Zugang zu Angeboten nur für geprüfte Personen</div>
        <div className="idstep"><${Icon} n="check" s=${18}/>Für Frauen: die Optionen „Frauen für Frauen“</div>
      </div>
      <label className="check"><input type="checkbox" id="consent" checked=${consent} onChange=${e=>{ setConsent(e.target.checked); setErr(''); }}/><span>Ich willige ein, dass mein Ausweis und mein Selfie, also biometrische Daten, für diese Prüfung verarbeitet werden. Ich kann die Einwilligung jederzeit widerrufen.</span></label>
      ${err && html`<p className="err" role="alert">${err}</p>`}
      <button className="btn" onClick=${()=>{ if(!consent){ setErr('Ohne Einwilligung können wir die Prüfung nicht durchführen.'); return; } setStep(1); }}>Weiter</button>
    </div>`}
    ${step===1 && html`<div className="stack g12">
      <div className="tile t-lav" style=${{ height:150, borderRadius:20 }}><${Icon} n="id" s=${72} w=${1.2}/></div>
      <p className="small muted">Lege deinen Personalausweis oder Reisepass auf einen dunklen Untergrund. Vorder- und Rückseite.</p>
      <button className="testbtn" onClick=${()=>setStep(2)}><${Icon} n="fast" s=${18}/>Testmodus: Testausweis verwenden</button>
    </div>`}
    ${step===2 && html`<div className="stack g12">
      <div className="tile t-peach" style=${{ height:150, borderRadius:20 }}><${Icon} n="camid" s=${72} w=${1.2}/></div>
      <p className="small muted">Halte dein Gesicht in den Rahmen und dreh den Kopf langsam. So erkennen wir, dass du wirklich da bist.</p>
      <button className="testbtn" onClick=${()=>setStep(3)}><${Icon} n="fast" s=${18}/>Testmodus: Selfie erfolgreich</button>
    </div>`}
    ${step===3 && html`<div className="stack g12">
      <div className="box b-mint"><${Icon} n="check"/><span>Ausweis und Selfie passen zusammen.</span></div>
      <div className="stack g8"><span className="label">Testmodus: Was steht im Ausweis beim Geschlecht?</span>

/* ---------- Gemeinsame Testwelt (db) ---------- */
const SH_EMPTY = { profiles:{}, listings:{}, threads:{}, orders:{}, reports:{}, alerts:{}, feedback:{} };
const isObj = v => v && typeof v==='object' && !Array.isArray(v);
function deepMerge(a, b){ const out = { ...(a||{}) }; for (const k in b){ const v = b[k]; out[k] = isObj(v) && isObj(out[k]) ? deepMerge(out[k], v) : v; } return out; }
const eq = (a,b) => JSON.stringify(a===undefined?null:a) === JSON.stringify(b===undefined?null:b);
const vals = m => Object.values(m||{});
const truthyKeys = m => Object.keys(m||{}).filter(k=>m[k]);
const uref = id => 'u:' + id;
const hashDist = id => { let h = 7; for (const c of String(id)) h = (h*31 + c.charCodeAt(0)) >>> 0; return Math.round((0.6 + (h % 540)/100) * 10) / 10; };
function last7(){ const out = []; const d = new Date(); for (let i=6;i>=0;i--){ const x = new Date(d); x.setDate(d.getDate()-i); out.push(dateKey(x)); } return out; }
let lastAt = 0; const stamp = () => { const n = Date.now(); lastAt = n > lastAt ? n : lastAt + 1; return lastAt; };
const clean = o => JSON.parse(JSON.stringify(o));
const MSG_SKIP = ['hidden','sender'];
const ORDER_F = ['status','phase','checkinAt','returnAt','address','companion','providerCompanion','slotKey','shared','customerReview','dispute','extended','method','dateText','amount','title','kind','fromDay','toDay','days','deposit','handover','dayKeys'];
const LIST_F = ['cat','title','price','desc','district','photo','status','flag','rejectReason','schedule','type','deposit','rent','pickupAddress','business'];
const SCREEN_NAMES = { edit:'Inserat bearbeiten', home:'Entdecken', favs:'Favoriten', create:'Inserieren', chats:'Chats', profile:'Profil', listing:'Inserat', chat:'Chat', order:'Auftrag', mylistings:'Meine Inserate', orders:'Meine Aufträge', admin:'Moderation', safety:'Sicherheit' };

function applyOp(raw, op){
  const col = { ...(raw[op.col]||{}) };
  if (op.kind==='set') col[op.id] = op.data; else if (op.kind==='update') col[op.id] = deepMerge(col[op.id], op.data); else delete col[op.id];
  return { ...raw, [op.col]: col };
}

function mergeState(s, raw, net){
  if (!net.shared || !s.user) return { ...s, net };

  const allO = vals(raw.orders).map(d => { const buyer = d.buyerId===me; const other = buyer ? d.providerId : d.buyerId; const p = P(other);

      buyerName: d.buyerId===me ? s.user.name : (P(d.buyerId).name || 'Jemand'), providerName: d.providerId===me ? s.user.name : (P(d.providerId).name || 'Jemand') }; })
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const myO = allO.filter(o => o.buyerId===me || o.providerId===me);
  const reviewsOf = id => allO.filter(o=>o.buyerId===id && o.customerReview).map(o=>({ id:'cr-' + o.id, by:o.providerName, stars:o.customerReview.stars, text:o.customerReview.text }));
  const days7 = last7();
  const sL = vals(raw.listings).filter(d=>d && d.title).map(d => { const mine = d.ownerId===me; const p = P(d.ownerId); const nm = mine ? s.user.name : (p.name || 'Jemand');
    const views = vals(d.views); const booked = truthyKeys(d.bookedMap);
    return { id:d.id, _sh:true, ownerId:d.ownerId, cat:d.cat, title:d.title, price:d.price, desc:d.desc, district:d.district, photo:d.photo||null, status:d.status, flag:d.flag||null, rejectReason:d.rejectReason||null,
      schedule:d.schedule||null, type:d.type||'service', deposit:d.deposit||0, rent:d.rent||null, pickupAddress:d.pickupAddress||'', business:!!d.business, created:d.created, mine, dist: mine ? 0.1 : hashDist(d.id), booked,
      reviews: vals(d.reviewMap).sort((a,b)=>(b.at||0)-(a.at||0)),
      provider:{ id: mine ? 'me' : uref(d.ownerId), name:nm, initial:nm[0], phone:true, idv: mine ? !!s.user.idVerified : !!p.idv, gender: mine ? (s.user.gender||null) : (p.gender||null), jobs:0, womenOnly:!!d.womenOnly, requireIdv:!!d.requireIdv },
      stats:{ views:views.length, favs:vals(d.favs).filter(Boolean).length, requests:0, bookings:booked.length, week:days7.map(k=>views.filter(v=>v===k).length) } }; })
    .sort((a,b)=>(b.created||0)-(a.created||0));
  const sT = vals(raw.threads).filter(d => (d.participants||[]).includes(me)).map(d => {
    const buyer = d.buyerId===me; const other = buyer ? d.providerId : d.buyerId; const p = P(other); const rd = (d.read||{})[me] || 0;

  const msgDoc = m => { const d = { ...m }; MSG_SKIP.forEach(k=>delete d[k]); d.from = m.sender || (m.from==='me' ? me : 'sys'); if (!d.at) d.at = stamp(); return clean(d); };

    if (Object.keys(msgs).length) { patch.msgs = msgs; patch.updated = Date.now(); }

      const me = netRef.current.uid; const buyerMsg = { id:uid(), at:stamp(), from:'sys', text:'Bezahlt. ' + money(o.amount) + ' sind sicher hinterlegt. ' + t.otherName + ' sieht jetzt deine Adresse.' + (extra.companion ? ' Du hast angegeben, dass du nicht allein bist.' : '') };
      const extraMsgs = t._sh ? [{ ...buyerMsg, to:me }, { id:uid(), at:stamp(), from:'sys', to:t.providerId, text:st.user.name + ' hat dein Angebot angenommen und ' + money(o.amount) + ' bezahlt. Das Geld ist hinterlegt. Die Adresse findest du im Auftrag.' + (extra.companion ? ' ' + st.user.name + ' ist beim Termin nicht allein.' : '') }] : [buyerMsg];
      act(x=>({ ...x, user:{ ...x.user, address:extra.address }, orders:[o, ...x.orders], threads: x.threads.map(tt=>tt.id===threadId?{ ...tt, updated:Date.now(), messages:[...tt.messages.map(mm=>mm.id===msgId?{ ...mm, offer:{ ...mm.offer, status:'accepted' } }:mm), ...extraMsgs] }:tt) }));
      toast('Zahlung erfolgreich. Das Geld ist hinterlegt.', 'ok');
      if (extra.share) later(800, ()=>notify('Termin mit ' + st.user.trusted.name + ' geteilt.'));
      themSay(threadId, 'Danke! Dann bis ' + m.offer.dateText.split(' · ')[0] + '.', 1800);
      go({ name:'order', id:o.id });
    },
    book(listingId, key, method, extra){
      const st = sRef.current; const l = st.listings.find(x=>x.id===listingId); const pv = l.provider; const dateText = slotDateText(l, key); const amount = bookAmount(l);
      let t = st.threads.find(x=>x.listingId===l.id && x.role==='buyer');
      const sys0 = { id:uid(), at:stamp(), from:'sys', text:'Termin direkt gebucht: ' + dateText + '. ' + money(amount) + ' sind sicher hinterlegt. ' + pv.name + ' sieht jetzt deine Adresse.' + (extra.companion ? ' Du hast angegeben, dass du nicht allein bist.' : '') };
      const sysList = l._sh ? [{ ...sys0, to:netRef.current.uid }, { id:uid(), at:stamp(), from:'sys', to:l.ownerId, text:st.user.name + ' hat ' + dateText + ' direkt über deine Zeiten gebucht und ' + money(amount) + ' bezahlt. Das Geld ist hinterlegt. Die Adresse findest du im Auftrag.' + (extra.companion ? ' ' + st.user.name + ' ist beim Termin nicht allein.' : '') }] : [sys0];
      const newThread = !t;
      if (!t) t = { id:'t-' + uid(), listingId:l.id, role:'buyer', otherId:pv.id, otherName:pv.name, otherIdv:!!pv.idv, messages:[], offerSent:true, unread:0, updated:Date.now(), day:today() };
      const o = { id:'o-' + uid(), threadId:t.id, listingId:l.id, role:'buyer', title:l.title, amount, method, dateText, status:'held', phase:'scheduled', slotKey:key,
        otherName:pv.name, otherIdv:!!pv.idv, createdAt:Date.now(), reviewed:false, address:extra.address, companion:extra.companion, providerCompanion:false, shared:extra.share };
      act(x=>({ ...x, user:{ ...x.user, address:extra.address }, orders:[o, ...x.orders],
        listings: x.listings.map(ll=>ll.id===l.id ? { ...ll, booked:[...(ll.booked||[]), key] } : ll),
        threads: newThread ? [{ ...t, offerSent:true, messages:sysList }, ...x.threads] : x.threads.map(tt=>tt.id===t.id ? { ...tt, offerSent:true, updated:Date.now(), messages:[...tt.messages, ...sysList] } : tt) }));
      toast('Gebucht! Das Geld ist hinterlegt.', 'ok');
      if (extra.share) later(800, ()=>notify('Termin mit ' + st.user.trusted.name + ' geteilt.'));
      themSay(t.id, 'Danke für deine Buchung! Ich freu mich, bis ' + dateText.split(' · ')[0] + '.', 2200);
      go({ name:'order', id:o.id });
    },
    simBooking(listingId){
      const st = sRef.current; const l = st.listings.find(x=>x.id===listingId);
      if (isRental(l)) {
        const fr = freeRentDays(l, 21); let pickDays = null;
        for (let i=0;i<fr.length-1 && !pickDays;i++) if (fr[i+1].i===fr[i].i+1) pickDays = [fr[i].k, fr[i+1].k];
        if (!pickDays && fr.length) pickDays = [fr[0].k];
        if (!pickDays) { toast('Alle Tage in den nächsten drei Wochen sind vermietet.', 'info'); return; }
        const u = st.user; const womenOnly = l.provider.womenOnly || u.settings.onlyWomenRequests;
        const n = pick(womenOnly ? ['Clara','Merve','Jule','Helga'] : ['Clara','Yusuf','Merve','Erik','Jule']);
        const idv = (l.provider.requireIdv || u.settings.onlyIdvRequests || womenOnly) ? true : Math.random() < .7;
        const rs = [R('Lena',5,''),R('Ali',5,''),R('Mia',4,'')].slice(0, 1 + Math.floor(Math.random()*3));
        const from = pickDays[0], to = pickDays[pickDays.length-1]; const days = pickDays.length; const amount = days * l.price.amount; const deposit = l.deposit || 0; const dateText = rangeText(from, to);
        const t = { id:'t-' + uid(), listingId:l.id, role:'provider', otherId:'p-' + n.toLowerCase(), otherName:n, otherIdv:idv, otherRating:fmtAvg(rs), offerSent:true, unread:1, updated:Date.now(), day:today(),
          messages:[{ id:uid(), from:'sys', text:n + ' hat „' + l.title + '“ für ' + dateText + ' gemietet und ' + money(amount + deposit) + ' bezahlt (davon ' + money(deposit) + ' Kaution).' }, { id:uid(), from:'them', text:'Hi ' + u.name + '! Passt es, wenn ich am ' + dkLabel(from) + ' gegen 18 Uhr vorbeikomme?' }] };
        const o = { id:'o-' + uid(), kind:'rental', threadId:t.id, listingId:l.id, role:'provider', title:l.title, amount, deposit, days, fromDay:from, toDay:to, dayKeys:pickDays, handover:'abholung', method:'—', dateText,
          status:'held', phase:'scheduled', otherName:n, otherIdv:idv, createdAt:Date.now(), address: l.pickupAddress || 'bei dir', companion:false, providerCompanion:false };
        act(x=>({ ...x, threads:[t, ...x.threads], orders:[o, ...x.orders],
          listings: x.listings.map(ll=>ll.id===l.id ? { ...ll, booked:[...(ll.booked||[]), ...pickDays], stats: ll.stats ? { ...ll.stats, bookings:ll.stats.bookings+1, views:ll.stats.views+3+Math.floor(Math.random()*9) } : ll.stats } : ll) }));
        notify(n + ' hat „' + l.title + '“ für ' + dateText + ' gemietet.');
        return;
      }
      const free = slotsFor(l, 14).flatMap(d=>d.times.filter(t=>!t.taken));
      if (!free.length) { toast('Alle Termine in den nächsten zwei Wochen sind belegt.', 'info'); return; }
      const slot = free[0]; const u = st.user;
      const womenOnly = l.provider.womenOnly || u.settings.onlyWomenRequests;
      const n = pick(womenOnly ? ['Clara','Merve','Jule','Helga'] : ['Clara','Yusuf','Merve','Erik','Jule']);
      const idv = (l.provider.requireIdv || u.settings.onlyIdvRequests || womenOnly) ? true : Math.random() < .7;
      const rs = [R('Lena',5,''),R('Ali',5,''),R('Mia',4,'')].slice(0, 1 + Math.floor(Math.random()*3));
      const dateText = slotDateText(l, slot.key); const amount = bookAmount(l);
      const t = { id:'t-' + uid(), listingId:l.id, role:'provider', otherId:'p-' + n.toLowerCase(), otherName:n, otherIdv:idv, otherRating:fmtAvg(rs), offerSent:true, unread:1, updated:Date.now(), day:today(),
        messages:[{ id:uid(), from:'sys', text:n + ' hat ' + dateText + ' direkt über deine Zeiten gebucht und ' + money(amount) + ' bezahlt. Das Geld ist hinterlegt.' }, { id:uid(), from:'them', text:'Hi ' + u.name + '! Ich hab gerade gebucht. Klingel einfach bei mir, ich bin zu Hause.' }] };
      const o = { id:'o-' + uid(), threadId:t.id, listingId:l.id, role:'provider', title:l.title, amount, method:'—', dateText, status:'held', phase:'scheduled', slotKey:slot.key, otherName:n, otherIdv:idv,
        createdAt:Date.now(), address: pick(['Lindenstraße 14, 2. OG links','Am Mühlbach 3, EG','Gartenweg 27, 1. OG']), providerCompanion:false, companion:Math.random()<.4 };
      act(x=>({ ...x, threads:[t, ...x.threads], orders:[o, ...x.orders],
        listings: x.listings.map(ll=>ll.id===l.id ? { ...ll, booked:[...(ll.booked||[]), slot.key], stats: ll.stats ? { ...ll.stats, bookings:ll.stats.bookings+1, views:ll.stats.views+3+Math.floor(Math.random()*9) } : ll.stats } : ll) }));
      notify(n + ' hat ' + dateText + ' gebucht und ' + money(amount) + ' bezahlt.');
    },
    declineOffer(threadId, msgId){
      act(x=>({ ...x, threads: x.threads.map(tt=>tt.id===threadId?{ ...tt, messages: tt.messages.map(mm=>mm.id===msgId?{ ...mm, offer:{ ...mm.offer, status:'declined' } }:mm) }:tt) }));
      themSay(threadId, 'Schade! Sag Bescheid, wenn ich dir ein anderes Angebot machen soll.', 1500);
    },
    sendOffer(threadId, amount, dateText, companion){
      const st = sRef.current; const t = st.threads.find(x=>x.id===threadId); const l = st.listings.find(x=>x.id===t.listingId);
      const msg = { id:uid(), from:'me', type:'offer', offer:{ title: l ? l.title : 'Auftrag', amount, dateText, status:'open', companion } };
      act(x=>({ ...x, threads: x.threads.map(tt=>tt.id===threadId?{ ...tt, updated:Date.now(), messages:[...tt.messages, msg] }:tt) }));
      if (t._sh) return;
      later(400, ()=>setTypingId(threadId));
      later(2600, ()=>{ setTypingId(null);
        const o = { id:'o-' + uid(), threadId, listingId:t.listingId, role:'provider', title:msg.offer.title, amount, method:'—', dateText, status:'held', phase:'scheduled', otherName:t.otherName, otherIdv:t.otherIdv,
          createdAt:Date.now(), address: pick(['Lindenstraße 14, 2. OG links','Am Mühlbach 3, EG','Gartenweg 27, 1. OG']), providerCompanion:companion, companion:false };
        act(x=>({ ...x, orders:[o, ...x.orders], threads: x.threads.map(tt=>tt.id===threadId?{ ...tt, updated:Date.now(), messages:[...tt.messages.map(mm=>mm.id===msg.id?{ ...mm, offer:{ ...mm.offer, status:'accepted' } }:mm), { id:uid(), from:'sys', text:t.otherName + ' hat dein Angebot angenommen und bezahlt. ' + money(amount) + ' sind hinterlegt. Die Adresse findest du jetzt im Auftrag.' }] }:tt) }));
        notify(t.otherName + ' hat dein Angebot über ' + money(amount) + ' angenommen.');
      });
    },
    simHarass(threadId){ themSay(threadId, 'Hey Süße, schick mir mal ein Foto von dir', 1200, { hidden:true }); },
    noAnswer(orderId){
      const st = sRef.current; const o = st.orders.find(x=>x.id===orderId); const tr = st.user.trusted;
      act(x=>({ ...x, alerts:[...x.alerts, { id:uid(), orderId, kind:'Keine Antwort auf Sicherheitsabfrage', text:x.user.name + ' antwortet nicht. Termin mit ' + o.otherName + ', ' + o.address + '.', time:nowTime(), status:'open' }] }));
      notify(tr ? tr.name + ' wurde informiert, dass du nicht antwortest. Unser Team ist ebenfalls benachrichtigt.' : 'Unser Team wurde benachrichtigt. Tipp: Leg eine Vertrauensperson an, damit sie in so einem Fall Bescheid bekommt.');
    },
    sos(orderId){
      const st = sRef.current; const o = st.orders.find(x=>x.id===orderId); const tr = st.user.trusted;
      act(x=>({ ...x, alerts:[...x.alerts, { id:uid(), orderId, kind:'Notfallknopf gedrückt', text:x.user.name + ' hat den Notfallknopf gedrückt. Termin mit ' + (o ? o.otherName + ', ' + o.address : '—') + '.', time:nowTime(), status:'open' }],
        orders: x.orders.map(oo=>oo.id===orderId ? { ...oo, status:'disputed', dispute:{ reason:'Notfall während des Termins', note:'Automatisch angelegt durch den Notfallknopf.' } } : oo) }));
      if (tr) later(600, ()=>notify(tr.name + ' hat deinen Notfall-Alarm mit Termin und Adresse bekommen.'));
    },
    sendFeedback, feedbackDone,
    feedbackSent(){ act(st=>({ ...st, feedbackGiven:true })); },
    openLegal(id){ setSheet({ kind:'legal', data:{ id } }); },
    rent(listingId, from, to, method, extra){
      const st = sRef.current; const l = st.listings.find(x=>x.id===listingId); const pv = l.provider;
      const dayKeys = daysBetween(from, to); const days = dayKeys.length; const amount = days * l.price.amount; const deposit = l.deposit || 0; const dateText = rangeText(from, to);
      const pickupText = extra.handover==='lieferung' ? 'Lieferung zu: ' + extra.address : (l.pickupAddress || 'Abholadresse folgt im Chat');
      let t = st.threads.find(x=>x.listingId===l.id && x.role==='buyer');
      const m0 = { id:uid(), at:stamp(), from:'sys', text:'Gemietet: ' + dateText + '. ' + money(amount) + ' Miete und ' + money(deposit) + ' Kaution sind sicher hinterlegt. ' + (extra.handover==='lieferung' ? pv.name + ' sieht jetzt deine Lieferadresse.' : 'Die Abholadresse findest du im Auftrag.') };
      const msgs = l._sh ? [{ ...m0, to:netRef.current.uid }, { id:uid(), at:stamp(), from:'sys', to:l.ownerId, text:st.user.name + ' hat „' + l.title + '“ für ' + dateText + ' gemietet und ' + money(amount + deposit) + ' bezahlt (davon ' + money(deposit) + ' Kaution). ' + (extra.handover==='lieferung' ? 'Die Lieferadresse findest du im Auftrag.' : st.user.name + ' holt bei dir ab.') }] : [m0];
      const newThread = !t;
      if (!t) t = { id:'t-' + uid(), listingId:l.id, role:'buyer', otherId:pv.id, otherName:pv.name, otherIdv:!!pv.idv, messages:[], offerSent:true, unread:0, updated:Date.now(), day:today() };
      const o = { id:'o-' + uid(), kind:'rental', threadId:t.id, listingId:l.id, role:'buyer', title:l.title, amount, deposit, days, fromDay:from, toDay:to, dayKeys, handover:extra.handover, method, dateText,
        status:'held', phase:'scheduled', otherName:pv.name, otherIdv:!!pv.idv, createdAt:Date.now(), reviewed:false, address:pickupText, companion:false, providerCompanion:false };
      act(x=>({ ...x, user: extra.address ? { ...x.user, address:extra.address } : x.user, orders:[o, ...x.orders],
        listings: x.listings.map(ll=>ll.id===l.id ? { ...ll, booked:[...(ll.booked||[]), ...dayKeys.filter(k=>!(ll.booked||[]).includes(k))] } : ll),
        threads: newThread ? [{ ...t, messages:msgs }, ...x.threads] : x.threads.map(tt=>tt.id===t.id ? { ...tt, offerSent:true, updated:Date.now(), messages:[...tt.messages, ...msgs] } : tt) }));
      toast('Gemietet! Miete und Kaution sind hinterlegt.', 'ok');
      themSay(t.id, extra.handover==='lieferung' ? 'Danke! Ich bringe es dir am ' + dkLabel(from) + ' vorbei und melde mich vorher kurz.' : 'Danke! Komm am ' + dkLabel(from) + ' einfach vorbei, ich zeig dir kurz, wie alles funktioniert.', 2200);
      go({ name:'order', id:o.id });
    },
    retryChat(listingId){ const l = sRef.current.listings.find(x=>x.id===listingId); if (l) setTimeout(()=>startChat(l), 50); },
    reopen(kind, data){ setSheet({ kind, data }); }
  };
  function onSaved(l, flag){
    back();
    toast(flag ? 'Gespeichert. Weil sich der Text geändert hat, prüft unser Team das Inserat noch einmal: ' + flag : 'Änderungen gespeichert.', flag ? 'info' : 'ok', flag ? 7000 : 3000);
  }
  function onCreated(l, verdict){
    setNav([{ name:'profile' }, { name:'mylistings' }]);
    if (verdict==='review') { toast('Die automatische Prüfung hat etwas gefunden: ' + (l.flag || 'unklarer Inhalt') + '. Unser Team prüft dein Inserat. Als Betreiber findest du es unter Profil › Moderation.', 'info', 8000); return; }
    toast('Wird geprüft …', 'info', 2500);
    later(3500, ()=>{
      act(st=>({ ...st, listings: st.listings.map(x=>x.id===l.id && x.status==='review' ? { ...x, status:'live' } : x) }));
      notify('Dein Inserat „' + l.title + '“ ist jetzt online.');
      later(9000, ()=>{
        if (netRef.current.shared) return;
        const u = sRef.current.user;
        const womenOnly = l.provider.womenOnly || u.settings.onlyWomenRequests;
        const pool = womenOnly ? ['Sarah','Helga','Clara','Merve','Jule'] : ['Sarah','Erik','Helga','Yusuf','Clara','Jonas'];
        const n = pick(pool);
        const idv = (l.provider.requireIdv || u.settings.onlyIdvRequests || womenOnly) ? true : Math.random() < .6;
        const rs = [R('Lena',5,''),R('Ali',5,''),R('Mia',4,'')].slice(0, 1 + Math.floor(Math.random()*3));
        const t = { id:'t-' + uid(), listingId:l.id, role:'provider', otherId:'p-' + n.toLowerCase(), otherName:n, otherIdv:idv, otherRating:fmtAvg(rs), offerSent:true, unread:1, updated:Date.now(), day:today(),
          messages:[{ id:uid(), from:'them', text:'Hi ' + u.name + '! Ich hab dein Inserat gesehen. Hättest du nächste Woche Zeit für mich?' }] };
        act(st=>({ ...st, threads:[t, ...st.threads] }));
        notify('Neue Anfrage von ' + n + (idv ? ' (Identität geprüft)' : '') + ' zu deinem Inserat.');
      });
    });
  }

  const Toasts = () => html`<div className="toasts" aria-live="polite">${toasts.map(t=> html`<div key=${t.id} className="toast"><${Icon} n=${t.kind==='push'?'bell':t.kind==='info'?'alert':'check'} s=${18}/><span>${t.text}</span></div>`)}</div>`;
  if (!s.user) return html`<div className="app"><${Onboarding} toast=${toast} account=${s.account}
    onLogin=${()=>{ const n = s.account.name; act(st=>({ ...st, user:st.account, account:null })); setNav([{ name:'home' }]); toast('Schön, dass du wieder da bist, ' + n + '!', 'ok'); }}
    onDone=${u=>{ act(()=>withName(seed(), u)); setNav([{ name:'home' }]); toast('Willkommen bei Neighbr, ' + u.name + '!', 'ok'); }}/><${Toasts}/></div>`;

  const props = { s, act, go, back, toast, notify, openSheet, startChat, bookSlot, bookRent, sendMessage, sendPhoto, typingId, simReviewOfMe, simBooking: actions.simBooking, markView, feedbackDone, screenName: SCREEN_NAMES[route.name] || 'App' };
  const top = ['home','favs','create','chats','profile'].includes(route.name);
  const screens = { home:Home, favs:Favorites, create:CreateScreen, edit:CreateScreen, chats:Chats, profile:Profile, listing:ListingScreen, chat:ChatScreen, order:OrderScreen, mylistings:MyListings, orders:Orders, admin:Admin, safety:SafetyScreen };
  const Screen = screens[route.name] || Home;
  const unreadChats = s.threads.reduce((a,t)=>a+(t.unread||0),0);
  const Tab = ({ name, icon, label, badge }) => html`<button className="tab" aria-current=${route.name===name ? 'page' : undefined} onClick=${()=>tab(name)}><${Icon} n=${icon}/>${label}${badge>0 && html`<span className="badge-dot">${badge}</span>`}</button>`;
  return html`<div className="app">
    <${Screen} key=${route.name + ':' + (route.id||'')} ...${props} id=${route.id} onCreated=${onCreated} onSaved=${onSaved}/>
    ${top && html`<nav className="tabbar" aria-label="Hauptmenü">
      <${Tab} name="home" icon="home" label="Entdecken"/>
      <${Tab} name="favs" icon="heart" label="Favoriten"/>
      <button className="fab" aria-label="Leistung inserieren" onClick=${()=>tab('create')}><${Icon} n="plus" s=${26} w=${2.4}/></button>
      <${Tab} name="chats" icon="chat" label="Chats" badge=${unreadChats}/>
      <${Tab} name="profile" icon="user" label="Profil"/>
    </nav>`}
    <${SheetHost} sheet=${sheet} close=${close} s=${s} act=${act} go=${go} toast=${toast} notify=${notify} actions=${actions}/>
    <${Toasts}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>

<div id="nb-install" hidden>
  <img src="icons/icon-192.png" alt="">
  <div class="t"><b>Neighbr als App</b><span id="nb-install-txt">Auf den Home-Bildschirm legen – startet wie eine richtige App.</span></div>
  <button class="go" id="nb-install-go">Installieren</button>
  <button class="x" id="nb-install-x" aria-label="Schließen">×</button>
</div>
<script>
(function(){
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
  var box = document.getElementById('nb-install'), go = document.getElementById('nb-install-go'), txt = document.getElementById('nb-install-txt');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var KEY = 'neighbr-install-dismissed';
  function dismissed(){ try { return localStorage.getItem(KEY) === '1'; } catch(e){ return false; } }
  function hide(){ box.hidden = true; try { localStorage.setItem(KEY, '1'); } catch(e){} }
  document.getElementById('nb-install-x').onclick = hide;
  if (standalone || dismissed()) return;
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    setTimeout(function(){ box.hidden = false; }, 4000);
  });
  go.onclick = function(){
    if (deferred) { deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; box.hidden = true; }); }
    else hide();
  };
  window.addEventListener('appinstalled', function(){ box.hidden = true; });
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    txt.innerHTML = 'In Safari unten auf <b style="display:inline;font-size:inherit">Teilen</b> tippen, dann <b style="display:inline;font-size:inherit">„Zum Home-Bildschirm“</b>.';
    go.textContent = 'Okay';
    setTimeout(function(){ box.hidden = false; }, 4000);
  }
})();
</script>
