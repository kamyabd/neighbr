<script>
(function(){
const { useState, useEffect, useReducer, useRef, useMemo } = React;
const html = htm.bind(React.createElement);
const KEY = 'neighbr-test-v4';

/* ---------- Helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const money = n => eur.format(n);
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const pad2 = n => String(n).padStart(2,'0');
function dayLabel(d){ return WD[d.getDay()] + ', ' + pad2(d.getDate()) + '.' + pad2(d.getMonth()+1) + '.'; }
function nextDays(n){ const out=[]; const d=new Date(); for(let i=1;i<=n;i++){ const x=new Date(d); x.setDate(d.getDate()+i); out.push(dayLabel(x)); } return out; }
function nextSaturday(){ const d=new Date(); const add=((6-d.getDay())+7)%7||7; d.setDate(d.getDate()+add); return dayLabel(d); }
function nowTime(){ const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function today(){ return dateKey(new Date()); }
const avgOf = rs => rs.length ? rs.reduce((a,r)=>a+r.stars,0)/rs.length : 0;
const fmtAvg = rs => rs.length ? '★ ' + avgOf(rs).toFixed(1).replace('.',',') + ' (' + rs.length + ')' : 'Neu';
const fmtRating = l => fmtAvg(l.reviews);
const km = d => String(d).replace('.',',') + ' km';
const priceText = p => p.unit === 'Std.' ? money(p.amount) + ' / Std.' : p.unit === 'pauschal' ? money(p.amount) + ' pauschal' : p.unit === 'Tag' ? money(p.amount) + ' / Tag' : 'ab ' + money(p.amount) + ' / ' + p.unit;
const offerAmount = p => p.unit === 'pauschal' ? p.amount : p.amount * 2;
const pick = a => a[Math.floor(Math.random()*a.length)];
const dateKey = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const WD_ORDER = [1,2,3,4,5,6,0];
const hh = h => pad2(h)+':00';
function nextWeekday(wd){ const d = new Date(); d.setHours(0,0,0,0); const add = ((wd - d.getDay()) + 7) % 7 || 7; d.setDate(d.getDate()+add); return d; }
function slotsFor(l, days=14){
  const sc = l.schedule; if (!sc) return [];
  const out = []; const base = new Date(); base.setHours(0,0,0,0);
  const booked = (l.booked||[]).map(k=>{ const [d,t]=k.split(' '); return { d, h:parseInt(t,10) }; });
  for (let i=1;i<=days;i++){
    const d = new Date(base); d.setDate(base.getDate()+i); const dk = dateKey(d); const on = sc.days.includes(d.getDay()); const times = [];
    if (on) for (let h=sc.from; h+sc.duration<=sc.to; h++){ const taken = booked.some(b=>b.d===dk && Math.abs(b.h-h)<sc.duration); times.push({ h, label:hh(h), key:dk+' '+hh(h), taken }); }
    out.push({ key:dk, wdn:d.getDay(), wd:WD[d.getDay()], date:pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.', on, times, free: times.filter(t=>!t.taken).length });
  }
  return out;
}
const scheduleText = sc => { const ds = WD_ORDER.filter(d=>sc.days.includes(d)).map(d=>WD[d]); return (ds.length===7 ? 'Täglich' : ds.join(', ')) + ' · ' + hh(sc.from) + '–' + hh(sc.to) + ' Uhr'; };

const DEF_F = { gender:'alle', unit:'alle', priceMin:'', priceMax:'', avail:'alle', days:[], minRating:0, sort:'nah' };
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? null : n; };
function filterListings(s, F, radius, onlyIdv, q, c){
  const u = s.user; const womenView = u.settings.onlyWomenProviders && u.gender==='w' && u.idVerified;
  const mn = num(F.priceMin), mx = num(F.priceMax); const ql = (q||'').trim().toLowerCase();
  const browse = s.browse || 'service'; const timeFilter = F.avail!=='alle' || F.days.length > 0;
  return s.listings.filter(l => {
    const pv = l.provider;
    if (l.status!=='live' || s.blocked.includes(pv.id)) return false;
    if ((l.type || 'service') !== browse) return false;
    if (!l.mine && l.dist > radius) return false;
    if (c && c!=='alle' && l.cat!==c) return false;
    if (onlyIdv && !pv.idv) return false;
    if (womenView && pv.gender!=='w') return false;
    if (F.gender!=='alle' && !(pv.idv && pv.gender===F.gender)) return false;
    if (mn!==null && l.price.amount < mn) return false;
    if (mx!==null && l.price.amount > mx) return false;
    if (F.minRating && !(l.reviews.length && avgOf(l.reviews) >= F.minRating)) return false;
    if (ql && !(l.title + ' ' + l.desc + ' ' + cat(l.cat).name + ' ' + pv.name).toLowerCase().includes(ql)) return false;
    if (isRental(l)) {
      if (timeFilter) { const fr = freeRentDays(l, 14);
        if (F.avail==='woche' && !fr.some(d=>d.i<=7)) return false;
        if (F.avail==='wochenende' && !fr.some(d=>d.i<=7 && (d.wdn===6 || d.wdn===0))) return false;
        if (F.days.length && !fr.some(d=>F.days.includes(d.wdn))) return false; }
      return true;
    }
    if (F.unit==='Std.' && l.price.unit!=='Std.') return false;
    if (F.unit==='pauschal' && l.price.unit==='Std.') return false;
    if (timeFilter) {
      if (!l.schedule) return false;
      const sl = slotsFor(l, 14);
      if (F.avail==='woche' && !sl.slice(0,7).some(d=>d.free>0)) return false;
      if (F.avail==='wochenende' && !sl.slice(0,7).some(d=>d.free>0 && (d.wdn===6 || d.wdn===0))) return false;
      if (F.days.length && !sl.some(d=>d.free>0 && F.days.includes(d.wdn))) return false;
    }
    return true;
  }).sort((a,b)=>{
    if (F.sort==='preis') return a.price.amount - b.price.amount;
    if (F.sort==='bewertung') return (avgOf(b.reviews) - avgOf(a.reviews)) || (b.reviews.length - a.reviews.length);
    return (b.mine?1:0)-(a.mine?1:0) || a.dist-b.dist;
  });
}
function activeFilters(F, radius, onlyIdv, browse){
  const out = [];
  if (F.gender!=='alle') out.push({ k:'gender', label: F.gender==='w' ? 'Nur Frauen' : 'Nur Männer', reset:{ gender:'alle' } });
  if (F.unit!=='alle' && browse!=='rental') out.push({ k:'unit', label: F.unit==='Std.' ? 'Pro Stunde' : 'Pauschal', reset:{ unit:'alle' } });
  if (num(F.priceMin)!==null || num(F.priceMax)!==null) out.push({ k:'price', label: (num(F.priceMin)!==null ? 'ab ' + money(num(F.priceMin)) + ' ' : '') + (num(F.priceMax)!==null ? 'bis ' + money(num(F.priceMax)) : ''), reset:{ priceMin:'', priceMax:'' } });
  if (F.avail!=='alle') out.push({ k:'avail', label: { direkt:'Direkt buchbar', woche:'Frei in den nächsten 7 Tagen', wochenende:'Frei am Wochenende' }[F.avail], reset:{ avail:'alle' } });
  if (F.days.length) out.push({ k:'days', label: WD_ORDER.filter(d=>F.days.includes(d)).map(d=>WD[d]).join(', '), reset:{ days:[] } });

}

function load(){
  try { const r = localStorage.getItem(KEY); if (r) { const s = JSON.parse(r);
    if (s && s.v === 3) {
      const rentals = seedRentals().filter(l=>!s.listings.some(x=>x.id===l.id));
      s.listings = [...rentals, ...s.listings.map(l=>l.id==='mine1' ? { ...l, example:true } : l)];
      if (s.user) s.listings = s.listings.map(l=>l.id==='mine2' ? { ...l, provider:{ ...l.provider, name:s.user.name, initial:s.user.name[0], idv:s.user.idVerified, gender:s.user.gender } } : l);
      s.v = 4; s.browse = 'service';
    }
    if (s && s.v === 4) return s; } } catch(e){}
  return seed();
}
function persist(s){
  try { localStorage.setItem(KEY, JSON.stringify(s)); }
  catch(e){ try { const lite = { ...s, listings: s.listings.map(l => ({ ...l, photo:null })), threads: s.threads.map(t=>({ ...t, messages: t.messages.map(m=> m.img ? { ...m, img:null, text:'[Foto]' } : m) })) }; localStorage.setItem(KEY, JSON.stringify(lite)); } catch(e2){} }
}
function shrinkImage(file, max, cb){
  if (!file || !file.type.startsWith('image/')) return;
  const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); const sc = Math.min(1, max/Math.max(img.width,img.height)); c.width = img.width*sc; c.height = img.height*sc; c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg', .72)); }; img.src = rd.result; };
  rd.readAsDataURL(file);
}

function RentPicker({ l, range, setRange, readOnly }){
  const [msg, setMsg] = useState('');
  const booked = new Set(l.booked || []); const maxDays = (l.rent && l.rent.maxDays) || 7;
  const start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate()+1);
  const lead = (start.getDay() + 6) % 7; const cells = [];
  for (let i=0;i<lead;i++) cells.push(null);
  for (let i=0;i<28;i++){ const d = new Date(start); d.setDate(start.getDate()+i); cells.push({ k:dateKey(d), day:d.getDate(), month:d.getMonth()+1 }); }
  const inRange = k => range && range.from && (range.to ? k>=range.from && k<=range.to : k===range.from);
  function tap(k){
    if (readOnly || booked.has(k)) return; setMsg('');
    if (!range || !range.from || range.to) { setRange({ from:k, to:null }); return; }
    if (k < range.from) { setRange({ from:k, to:null }); return; }
    const ks = daysBetween(range.from, k);
    if (ks.some(x=>booked.has(x))) { setMsg('In diesem Zeitraum ist der Gegenstand schon an einem Tag vermietet. Wähle einen anderen Zeitraum.'); return; }
    if (ks.length > maxDays) { setMsg('Höchstens ' + maxDays + (maxDays===1?' Tag':' Tage') + ' am Stück.'); return; }
    setRange({ from:range.from, to:k });
  }
  const nDays = range && range.from ? daysBetween(range.from, range.to || range.from).length : 0;
  return html`<div className="panel stack g12" style=${{ padding:14 }}>
    <div className="row g10"><div className="tile t-lav" style=${{ width:40, height:40, borderRadius:13 }}><${Icon} n="calendar" s=${20}/></div>
      <div className="stack grow" style=${{ gap:2 }}><span style=${{ fontWeight:600 }}>${readOnly ? 'So sehen andere deinen Kalender' : 'Wann möchtest du mieten?'}</span><span className="small muted">${readOnly ? 'Gebuchte Tage sind durchgestrichen.' : 'Tippe auf den ersten und den letzten Tag.'} Höchstens ${maxDays} ${maxDays===1?'Tag':'Tage'} am Stück.</span></div></div>
    <div style=${{ display:'grid', gridTemplateColumns:'repeat(7,minmax(0,1fr))', gap:4 }} role="group" aria-label="Kalender">
      ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=> html`<span key=${w} className="tiny muted" style=${{ textAlign:'center' }}>${w}</span>`)}
      ${cells.map((c,i)=> !c ? html`<span key=${'e'+i}></span>` : html`<button key=${c.k} disabled=${readOnly || booked.has(c.k)} aria-pressed=${!!inRange(c.k)} aria-label=${dkLabel(c.k) + (booked.has(c.k) ? ' vermietet' : ' frei')} onClick=${()=>tap(c.k)}
        style=${{ height:42, borderRadius:12, border: inRange(c.k) ? 'none' : '1.5px solid var(--line)', background: inRange(c.k) ? 'var(--accent)' : 'var(--surface)', color: inRange(c.k) ? 'var(--on-accent)' : 'var(--ink)', fontSize:14, fontWeight: inRange(c.k) ? 600 : 400, opacity: booked.has(c.k) ? .4 : 1, textDecoration: booked.has(c.k) ? 'line-through' : 'none', padding:0, fontVariantNumeric:'tabular-nums' }}>${c.day}</button>`)}
    </div>
    ${msg && html`<p className="err" role="alert">${msg}</p>`}
    ${!readOnly && range && range.from && html`<div className="kv" style=${{ paddingTop:8, borderTop:'1.5px solid var(--line)' }}><span>${rangeText(range.from, range.to || range.from)} · ${nDays} ${nDays===1?'Tag':'Tage'}</span><span className="price" style=${{ fontSize:16 }}>${money(nDays * l.price.amount)}</span></div>`}
    ${!readOnly && range && range.from && !range.to && html`<span className="tiny muted">Nur einen Tag? Dann kannst du direkt buchen. Für mehrere Tage tippe auf den letzten Tag.</span>`}
  </div>`;
}

      ${warn && html`<p className="err" role="alert">${warn}</p>`}

          : html`<button type="button" className="iconbtn sunk" style=${{ width:46, height:46, color:'var(--muted)' }} aria-label="Fotos erst nach Buchung" onClick=${()=>toast('Fotos kannst du erst nach einer Buchung senden und empfangen. So schützen wir alle vor ungewollten Bildern.', 'info', 5000)}><${Icon} n="lock" s=${20}/></button>`}

const STEPS = [ { k:'held', t:'Bezahlt & hinterlegt' }, { k:'checkin', t:'Check-in beim Termin' }, { k:'due', t:'Erledigt & bestätigt' }, { k:'released', t:'Ausgezahlt' } ];

  const buyer = o.role==='buyer';

  const phase = o.phase || 'scheduled';

    disputed: ['Wir prüfen den Fall', 'Die Auszahlung ist gestoppt. Unser Team meldet sich innerhalb von 48 Stunden bei euch beiden.','butter'],
    refunded: buyer ? ['Geld zurück', money(o.amount) + ' wurden auf dein Zahlungsmittel zurückgebucht.','butter'] : ['Auftrag storniert', 'Das Geld ging zurück an ' + o.otherName + '.','butter']
  }[o.status];
  function checkin(){ upd({ phase:'checkedin', checkinAt:nowTime() }); sysMsg('Check-in um ' + nowTime() + ' Uhr. Der Termin läuft.'); if (o.shared && trusted) notify(trusted.name + ' sieht jetzt: Termin läuft.'); }
  function checkout(){
    if (buyer) { upd({ phase:'checkedout', status:'due' }); sysMsg('Check-out um ' + nowTime() + ' Uhr.'); }
    else { upd({ phase:'checkedout', status:'due' }); sysMsg('Check-out um ' + nowTime() + ' Uhr. ' + o.otherName + ' wird gebeten, den Auftrag zu bestätigen.'); }
    if (o.shared && trusted) notify(trusted.name + ' sieht jetzt: Termin beendet, alles okay.');
  }
  function release(){ upd({ status:'released' }); sysMsg('Auftrag bestätigt. ' + money(o.amount) + ' wurden an ' + o.otherName + ' ausgezahlt.'); toast('Geld freigegeben. Danke!', 'ok'); simReviewOfMe(o); }
  function sendReview(){
    if (!stars) { setRerr('Bitte wähle 1 bis 5 Sterne.'); return; }

    if (buyer) act(st => ({ ...st, orders: st.orders.map(x=>x.id===o.id?{ ...x, reviewed:true }:x),

  const shareText = 'Ich habe über Neighbr einen Termin.\nWer: ' + o.otherName + (o.otherIdv ? ' (Identität geprüft)' : ' (Identität nicht geprüft)') + '\nWann: ' + o.dateText + '\nWo: ' + (o.address || '—') + '\nLive-Status: neighbr.app/t/' + o.id.slice(2,8);
  return html`<div className="stack" style=${{ flex:'1 1 auto', minHeight:0 }}>
    <div className="screen">
      <${Header} title=${buyer ? 'Dein Auftrag' : 'Auftrag für ' + o.otherName} onBack=${back}/>
      <div className="pad stack g20" style=${{ paddingBlock:'4px 24px' }}>
        <div className=${'stack g10 t-' + hero[2]} style=${{ borderRadius:26, padding:20 }}>
          <div className="row g10">
            <div className="tile" style=${{ width:52, height:52, borderRadius:18, background:'var(--surface)' }}><${Icon} n=${o.status==='disputed'?'alert':o.status==='refunded'?'refresh':phase==='checkedin'&&o.status==='held'?'clock':'shield'} s=${28}/></div>
            ${phase==='checkedin' && o.status==='held' && html`<span className="row g6 small" style=${{ fontWeight:600 }}><span className="live"></span>Live</span>`}
          </div>
          <h1 className="title-l">${hero[0]}</h1><p className="small" style=${{ lineHeight:1.5 }}>${hero[1]}</p>
        </div>

        ${o.status==='held' && phase==='checkedin' && html`<button className="btn sos" onClick=${()=>openSheet('sos', { orderId:o.id })}><${Icon} n="sos" s=${22}/>Notfall</button>`}

        <div className="panel stack g8" style=${{ padding:16 }}>
          <span style=${{ fontWeight:600 }}>${o.title}</span>
          <div className="kv"><span className="muted">Termin</span><span>${o.dateText}</span></div>
          <div className="kv"><span className="muted">${buyer ? 'Anbieter:in' : 'Kund:in'}</span><span className="row g6" style=${{ justifyContent:'flex-end' }}>${o.otherName}${o.otherIdv && html`<span style=${{ color:'var(--mint-ink)', display:'inline-flex' }} aria-label="Identität geprüft"><${Icon} n="shield" s=${15}/></span>`}</span></div>
          <div className="kv"><span className="muted">Adresse</span><span>${o.address}${buyer && html`<span className="tiny muted" style=${{ display:'block' }}>nur für ${o.otherName} sichtbar</span>`}</span></div>
          ${o.companion && html`<div className="kv"><span className="muted">Begleitung</span><span>${buyer ? 'Du bist nicht allein' : 'Kund:in ist nicht allein'}</span></div>`}
          ${o.providerCompanion && html`<div className="kv"><span className="muted">Begleitung</span><span>${buyer ? o.otherName + ' kommt zu zweit' : 'Du kommst zu zweit'}</span></div>`}
          <div className="kv"><span className="muted">Betrag</span><span>${money(o.amount)}</span></div>
          ${buyer && html`<div className="kv"><span className="muted">Bezahlt mit</span><span>${o.method} (Test)</span></div>`}
        </div>

        ${o.status==='held' && html`<div className="panel stack g10" style=${{ padding:14 }}>
          <div className="row g10"><div className="tile t-lav" style=${{ width:40, height:40, borderRadius:13 }}><${Icon} n="share" s=${20}/></div>
            <div className="stack grow" style=${{ gap:2 }}><span style=${{ fontWeight:600 }}>Termin teilen</span><span className="small muted">${o.shared && trusted ? 'Geteilt mit ' + trusted.name + '. Sie bekommt Check-in, Check-out und Notfälle mit.' : 'Gib einer Vertrauensperson Bescheid, wer kommt, wann und wohin.'}</span></div></div>
          ${!o.shared && html`<button className="btn outline sm" style=${{ width:'100%' }} onClick=${()=>openSheet('share', { orderId:o.id, text:shareText })}>Mit Vertrauensperson teilen</button>`}
        </div>`}

        <div className="timeline" aria-label="Status">
          ${STEPS.map((st,i)=>{
            const bad = (o.status==='disputed'||o.status==='refunded') && i===2;
            const done = i < idx || (i===1 && (phase==='checkedin' || phase==='checkedout') && !bad && o.status!=='refunded') ;
            const cls = bad ? 'bad' : done ? 'done' : i===idx ? 'now' : '';
            const label = bad ? (o.status==='disputed' ? 'Problem gemeldet' : 'Storniert & erstattet') : i===1 && o.checkinAt ? 'Check-in um ' + o.checkinAt + ' Uhr' : st.t;
            return html`<div key=${st.k} className="step">
              <div className="rail"><div className=${'dot ' + cls}>${cls==='done' && html`<${Icon} n="check" s=${16} w=${3}/>`}${bad && html`<${Icon} n="alert" s=${16}/>`}</div>${i<3 && html`<div className=${'bar ' + (done?'done':'')}></div>`}</div>
              <span style=${{ paddingTop:4, fontWeight:600, color: cls ? 'var(--ink)' : 'var(--muted)', paddingBottom:16 }}>${label}</span>

          </div>

        </div>`}
        ${o.reviewed && html`<div className="box b-lav"><${Icon} n="star"/><span>Deine Bewertung ist gespeichert. Danke, dass du die Nachbarschaft sicherer machst.</span></div>`}

    </div>
    ${buyer && o.status==='due' && html`<div className="footer pad stack g8">
      <button className="btn" onClick=${release}>Erledigt – Geld freigeben</button>
      <button className="btn danger" onClick=${()=>openSheet('dispute', { orderId:o.id })}>Es gibt ein Problem</button>
    </div>`}
    ${o.threadId && html`<div className="footer pad" style=${{ paddingBlock:'4px 12px', borderTop: buyer && o.status==='due' ? 'none' : '1.5px solid var(--line)' }}><button className="btn ghost" onClick=${()=>go({ name:'chat', id:o.threadId })}><${Icon} n="chat" s=${18}/>Chat mit ${o.otherName}</button></div>`}
  </div>`;
}

const RSTEPS = ['Bezahlt & hinterlegt','Übergabe','Rückgabe','Abgeschlossen'];

  }[o.status];

  function giveBack(){ upd({ phase:'returned', returnAt:nowTime(), status:'due' }); sysMsg('Rückgabe um ' + nowTime() + ' Uhr bestätigt. Jetzt wird geprüft, ob alles in Ordnung ist.'); }

          <h1 className="title-l">${hero[0]}</h1><p className="small" style=${{ lineHeight:1.5 }}>${hero[1]}</p>
        </div>
        <div className="panel stack g8" style=${{ padding:16 }}>
          <span style=${{ fontWeight:600 }}>${o.title}</span>
          <div className="kv"><span className="muted">Zeitraum</span><span>${o.dateText} · ${o.days} ${o.days===1?'Tag':'Tage'}</span></div>
          <div className="kv"><span className="muted">${renter ? 'Vermieter:in' : 'Mieter:in'}</span><span className="row g6" style=${{ justifyContent:'flex-end' }}>${o.otherName}${o.otherIdv && html`<span style=${{ color:'var(--mint-ink)', display:'inline-flex' }} aria-label="Identität geprüft"><${Icon} n="shield" s=${15}/></span>`}</span></div>
          <div className="kv"><span className="muted">Übergabe</span><span>${o.handover==='lieferung' ? (renter ? 'Lieferung zu dir' : 'Du lieferst') : (renter ? 'Du holst ab' : o.otherName + ' holt ab')}</span></div>
          <div className="kv"><span className="muted">${o.handover==='lieferung' ? 'Lieferadresse' : 'Abholadresse'}</span><span>${String(o.address || '').replace(/^Lieferung zu: /, '')}</span></div>
          <div className="kv"><span className="muted">Miete</span><span>${money(o.amount)}</span></div>
          <div className="kv"><span className="muted">Kaution</span><span>${money(dep)}</span></div>
          ${renter && html`<div className="kv"><span className="muted">Bezahlt mit</span><span>${o.method} (Test)</span></div>`}
        </div>
        <div className="timeline" aria-label="Status">
          ${RSTEPS.map((t,i)=>{
            const bad = (o.status==='disputed'||o.status==='refunded') && i===idx;
            const cls = bad ? 'bad' : i < idx ? 'done' : i===idx ? 'now' : '';
            const label = bad ? (o.status==='disputed' ? 'Problem gemeldet' : 'Storniert & erstattet') : i===1 && o.checkinAt ? 'Übergabe um ' + o.checkinAt + ' Uhr' : i===2 && o.returnAt ? 'Rückgabe um ' + o.returnAt + ' Uhr' : t;
            return html`<div key=${t} className="step">
              <div className="rail"><div className=${'dot ' + cls}>${cls==='done' && html`<${Icon} n="check" s=${16} w=${3}/>`}${bad && html`<${Icon} n="alert" s=${16}/>`}</div>${i<3 && html`<div className=${'bar ' + (i<idx?'done':'')}></div>`}</div>
              <span style=${{ paddingTop:4, fontWeight:600, color: cls ? 'var(--ink)' : 'var(--muted)', paddingBottom:16 }}>${label}</span>
            </div>`; })}
        </div>
        ${o.status==='held' && phase==='scheduled' && html`<div className="stack g8">
          <button className="btn" onClick=${handover}><${Icon} n="key" s=${20}/>Übergabe bestätigen</button>
          <p className="small muted">Tipp: Macht bei der Übergabe kurz Fotos vom Zustand und schickt sie euch im Chat. Dann gibt es bei der Rückgabe keine Diskussion.</p>
          ${renter && html`<button className="btn danger" onClick=${()=>openSheet('cancel', { orderId:o.id })}>Miete stornieren</button>`}
        </div>`}
        ${o.status==='held' && phase==='handedover' && html`<div className="stack g8">
          <button className="btn" onClick=${giveBack}><${Icon} n="refresh" s=${20}/>Rückgabe bestätigen</button>
          ${renter && html`<button className="btn danger" onClick=${()=>openSheet('dispute', { orderId:o.id, rental:'renter' })}>Gegenstand funktioniert nicht</button>`}
        </div>`}
        ${renter && o.status==='due' && !o._sh && html`<button className="testbtn" onClick=${()=>{ finish(); notify(dep ? 'Deine Kaution von ' + money(dep) + ' ist auf dem Weg zurück.' : o.otherName + ' hat die Rückgabe bestätigt.'); simReviewOfMe(o); }}><${Icon} n="fast" s=${18}/>Testmodus: ${o.otherName} bestätigt die Rückgabe</button>`}
        ${renter && o.status==='due' && o._sh && html`<p className="small muted">${o.otherName} bekommt eine Nachricht und bestätigt die Rückgabe in der App.</p>`}
        ${o.status==='released' && !o.reviewed && html`<div className="panel stack g12" style=${{ padding:16 }}>
          <h2 className="title-m">${renter ? 'Wie war die Miete bei ' + o.otherName + '?' : 'Wie war ' + o.otherName + ' als Mieter:in?'}</h2>
          <div className="row stars" role="group" aria-label="Sterne">
            ${[1,2,3,4,5].map(n=> html`<button key=${n} aria-label=${n + ' Sterne'} aria-pressed=${n<=stars} onClick=${()=>{ setStars(n); setRerr(''); }}><${Icon} n="star" s=${36} w=${1.5} fill="currentColor"/></button>`)}
          </div>
          <textarea id="rrv" className="input" placeholder=${renter ? 'Zustand, Übergabe, Erklärung (optional)' : 'Pünktlich? Sorgfältig? (optional)'} value=${rtext} onChange=${e=>{ setRtext(e.target.value); setRerr(''); }} style=${{ minHeight:90 }}></textarea>
          ${rerr && html`<p className="err" role="alert">${rerr}</p>`}
          <button className="btn" onClick=${sendReview}>Bewertung abschicken</button>
        </div>`}
        ${o.reviewed && html`<div className="box b-lav"><${Icon} n="star"/><span>Deine Bewertung ist gespeichert. Danke!</span></div>`}
      </div>
    </div>
    ${!renter && o.status==='due' && html`<div className="footer pad stack g8">
      <button className="btn" onClick=${finish}>Alles in Ordnung – abschließen</button>
      <button className="btn danger" onClick=${()=>openSheet('dispute', { orderId:o.id, rental:'owner' })}>Schaden oder Problem melden</button>
    </div>`}
    ${o.threadId && html`<div className="footer pad" style=${{ paddingBlock:'4px 12px', borderTop: !renter && o.status==='due' ? 'none' : '1.5px solid var(--line)' }}><button className="btn ghost" onClick=${()=>go({ name:'chat', id:o.threadId })}><${Icon} n="chat" s=${18}/>Chat mit ${o.otherName}</button></div>`}
  </div>`;
}

function Favorites({ s, act, go }){
  const list = s.listings.filter(l=>s.favorites.includes(l.id) && l.status==='live');
  return html`<div className="screen"><div className="pad stack g16" style=${{ paddingBlock:'20px 24px' }}>
    <h1 className="title-xl">Favoriten</h1>
    ${list.length===0 && html`<div className="empty"><div className="tile t-peach" style=${{ width:64, height:64, borderRadius:20 }}><${Icon} n="heart" s=${28}/></div><p style=${{ fontWeight:600 }}>Noch keine Favoriten</p><p className="small muted">Tippe auf das Herz bei einem Inserat, um es hier zu speichern.</p></div>`}
    ${list.map(l=> html`<${ListingCard} key=${l.id} l=${l} fav=${true} onOpen=${()=>go({ name:'listing', id:l.id })} onFav=${()=>act(st=>({ ...st, favorites: st.favorites.filter(x=>x!==l.id) }))}/>`)}
  </div></div>`;
}

function Chats({ s, go }){
  const list = [...s.threads].sort((a,b)=>b.updated-a.updated);
  return html`<div className="screen"><div className="pad stack g16" style=${{ paddingBlock:'20px 24px' }}>
    <h1 className="title-xl">Chats</h1>
    ${list.length===0 && html`<div className="empty"><div className="tile t-lav" style=${{ width:64, height:64, borderRadius:20 }}><${Icon} n="chat" s=${28}/></div><p style=${{ fontWeight:600 }}>Noch keine Chats</p><p className="small muted">Frag bei einem Inserat an. Dein Chat erscheint dann hier.</p></div>`}
    ${list.length>0 && html`<div className="panel">${list.map(t=>{
      const l = s.listings.find(x=>x.id===t.listingId); const last = t.messages[t.messages.length-1];
      const lastText = last ? (last.type==='offer' ? 'Angebot: ' + money(last.offer.amount) : last.hidden && !last.revealed ? 'Ausgeblendete Nachricht' : last.img ? 'Foto' : last.text) : '';
      return html`<button key=${t.id} className="listrow" onClick=${()=>go({ name:'chat', id:t.id })}>
        <${Avatar} name=${t.otherName} size=${48} tone=${t.role==='provider'?'mint':'peach'}/>
        <div className="stack grow" style=${{ gap:2 }}>
          <div className="row g6"><span style=${{ fontWeight:600 }}>${t.otherName}</span><span className=${'pill ' + (t.role==='provider'?'p-mint':'p-lav')} style=${{ padding:'2px 7px', fontSize:11 }}>${t.role==='provider'?'Anfrage an dich':'Deine Anfrage'}</span></div>
          <span className="small muted ell">${lastText}</span>
          <span className="tiny muted ell">${l ? l.title : ''}</span>
        </div>
        ${t.unread>0 && html`<span className="badge-dot" style=${{ position:'static' }}>${t.unread}</span>`}
      </button>`;
    })}</div>`}
  </div></div>`;
}

const EMPTY_FORM = { business:false, kind:'service', title:'', cat:'', amount:'', unit:'Std.', desc:'', photos:[], district:'', womenOnly:false, requireIdv:false, sched:false, days:[], from:12, to:18, duration:2, deposit:'', handover:'abholung', maxDays:7, pickupAddress:'' };
function formFrom(l){
  if (!l) return { ...EMPTY_FORM };
  const sc = l.schedule; const r = l.rent || {};
  return { ...EMPTY_FORM, kind: isRental(l) ? 'rental' : 'service', title:l.title, cat:l.cat, amount:String(l.price.amount).replace('.',','), unit: isRental(l) ? 'Tag' : l.price.unit,
    desc:l.desc, photos: l.photo ? [l.photo] : [], district:l.district || '', womenOnly:!!l.provider.womenOnly, requireIdv:!!l.provider.requireIdv,
    business:!!l.business, sched:!!sc, days: sc ? [...sc.days] : [], from: sc ? sc.from : 12, to: sc ? sc.to : 18, duration: sc ? sc.duration : 2,
    deposit: l.deposit ? String(l.deposit).replace('.',',') : '', handover: r.handover || 'abholung', maxDays: r.maxDays || 7, pickupAddress: l.pickupAddress || '' };
}

function CreateScreen({ s, act, onCreated, onSaved, back, id, openSheet }){
  const editing = id ? s.listings.find(x=>x.id===id && x.mine) : null;
  const [f, setF] = useState(() => formFrom(editing));
  const [err, setErr] = useState({}); const [blocked, setBlocked] = useState(false);
  const set = (k,v) => { setF(x=>({ ...x, [k]:v })); setErr(e=>({ ...e, [k]:null })); setBlocked(false); };
  const rental = f.kind==='rental';
  const canWomen = s.user.idVerified && s.user.gender==='w';
  const amtN = num(f.amount);
  if (id && !editing) return html`<div className="screen"><${Header} title="Inserat bearbeiten" onBack=${back}/><div className="empty"><p>Dieses Inserat gibt es nicht mehr.</p></div></div>`;
  function setKind(k){ if (editing) return; setF(x=>({ ...x, kind:k, cat:'', unit: k==='rental' ? 'Tag' : 'Std.', sched:false })); setErr({}); setBlocked(false); }
  function addPhotos(e){ Array.from(e.target.files || []).slice(0, 3 - f.photos.length).forEach(file => shrinkImage(file, 720, url => setF(x=>({ ...x, photos:[...x.photos, url].slice(0,3) })))); e.target.value = ''; }
  function submit(){
    const e = {}; const amt = amtN; const dep = num(f.deposit);
    if (f.title.trim().length < 8) e.title = 'Der Titel braucht mindestens 8 Zeichen.';
    if (!f.cat) e.cat = 'Bitte wähle eine Kategorie.';
    if (!(amt > 0)) e.amount = 'Bitte gib einen Preis ein.'; else if (amt > 500) e.amount = 'Maximal 500 € in dieser Version.';
    if (f.desc.trim().length < 30) e.desc = rental ? 'Beschreibe den Gegenstand in mindestens 30 Zeichen: Zustand, Zubehör, Besonderheiten.' : 'Beschreibe deine Leistung in mindestens 30 Zeichen.';
    if (f.district.trim().length < 2) e.district = 'Bitte gib deinen Stadtteil an. Die genaue Adresse bleibt privat.';
    if (rental) {
      if (f.deposit.trim() && (dep===null || dep < 0)) e.deposit = 'Bitte gib eine gültige Kaution ein oder lass das Feld leer.';
      else if (dep > 1000) e.deposit = 'Maximal 1.000 € Kaution in dieser Version.';
      if (f.handover!=='lieferung' && f.pickupAddress.trim().length < 6) e.pickupAddress = 'Bitte gib die Abholadresse ein. Sie wird erst nach der Buchung angezeigt.';
    } else if (f.sched) {
      if (!f.days.length) e.sched = 'Wähle mindestens einen Wochentag.';
      else if (f.to - f.from < f.duration) e.sched = 'Das Zeitfenster ist kürzer als ein Termin. Verlängere es oder verkürze die Termindauer.';
    }
    setErr(e); if (Object.keys(e).length) return;
    const text = f.title + ' ' + f.desc;
    const verdict = moderate(text);
    if (verdict === 'blocked') { setBlocked(true); return; }
    const fields = { business:!!f.business, cat:f.cat, title:f.title.trim(), price:{ amount:Math.round(amt*100)/100, unit: rental ? 'Tag' : f.unit }, district:f.district.trim(), desc:f.desc.trim(), photo:f.photos[0] || null,
      schedule: !rental && f.sched ? { days:[...f.days], from:f.from, to:f.to, duration:f.duration } : null,
      ...(rental ? { type:'rental', deposit: dep ? Math.round(dep*100)/100 : 0, rent:{ handover:f.handover, maxDays:f.maxDays }, pickupAddress: f.handover==='lieferung' ? '' : f.pickupAddress.trim() } : {}) };
    if (editing) {
      const textChanged = editing.title!==fields.title || editing.desc!==fields.desc;
      const status = textChanged && verdict==='review' ? 'review' : editing.status;
      const flag = textChanged ? (verdict==='review' ? modReasons(text).join(' · ') : null) : (editing.flag || null);
      act(st => ({ ...st, listings: st.listings.map(x => x.id===editing.id ? { ...x, ...fields, status, flag,
        provider:{ ...x.provider, womenOnly: canWomen && f.womenOnly, requireIdv:f.requireIdv } } : x) }));
      onSaved(editing, status!==editing.status && status==='review' ? flag : null);
      return;
    }
    const l = { id:'l-' + uid(), ...fields, type: rental ? 'rental' : 'service',
      provider:{ id:'me', name:s.user.name, initial:s.user.name[0], phone:true, idv:s.user.idVerified, gender:s.user.gender, jobs:0, womenOnly: canWomen && f.womenOnly, requireIdv:f.requireIdv },
      dist:0.1, status:'review', mine:true, reviews:[], created:Date.now(), booked:[], stats:{ views:0, favs:0, requests:0, bookings:0, week:[0,0,0,0,0,0,0] },
      flag: verdict==='review' ? modReasons(text).join(' · ') : null };
    act(st => ({ ...st, listings:[l, ...st.listings] }));
    setF({ ...EMPTY_FORM, kind:f.kind, unit: rental ? 'Tag' : 'Std.' });
    onCreated(l, verdict);
  }
  const cats = rental ? RCATS : CATS;
  return html`<div className="stack" style=${{ flex:'1 1 auto', minHeight:0 }}>
    ${editing && html`<${Header} title="Inserat bearbeiten" onBack=${back}/>`}
    <div className="screen"><div className="pad stack g20" style=${{ paddingBlock: editing ? '4px 24px' : '20px 24px' }}>
      ${!editing && html`<h1 className="title-xl">${rental ? 'Was möchtest du vermieten?' : 'Was kannst du anbieten?'}</h1>`}
      ${!editing && html`<div className="seg" role="group" aria-label="Art des Inserats">
        <button aria-pressed=${!rental} onClick=${()=>setKind('service')}>Hilfe anbieten</button>
        <button aria-pressed=${rental} onClick=${()=>setKind('rental')}>Etwas vermieten</button>
      </div>`}
      ${editing && editing.status==='live' && html`<div className="box b-lav"><${Icon} n="alert"/><span>Änderungen gelten sofort. Wenn du Titel oder Beschreibung änderst, prüfen wir den Text erneut. Bereits gebuchte Termine bleiben bestehen.</span></div>`}
      <div className="stack g8"><span className="label">Fotos <span className="muted" style=${{ fontWeight:400 }}>(optional, bis zu 3, keine Personen)</span></span>
        <div className="row g10 wrap">
          ${f.photos.map((p,i)=> html`<div key=${i} className="tile" style=${{ width:96, height:96, borderRadius:20, position:'relative' }}><img src=${p} alt=${'Foto ' + (i+1)}/>
            <button className="iconbtn" aria-label="Foto entfernen" onClick=${()=>set('photos', f.photos.filter((_,j)=>j!==i))} style=${{ position:'absolute', top:4, right:4, width:30, height:30, borderRadius:10 }}><${Icon} n="x" s=${14}/></button></div>`)}
          ${f.photos.length<3 && html`<label className="photo-add"><${Icon} n="camera"/>Foto<input className="vh" type="file" id="photo" accept="image/*" multiple onChange=${addPhotos}/></label>`}
        </div>
      </div>
      <div className="field"><label htmlFor="t">Titel</label><input id="t" className="input" maxLength="80" placeholder=${rental ? 'z. B. Bohrhammer mit Bohrerset' : 'z. B. Ich trage dein Laub zusammen'} value=${f.title} onChange=${e=>set('title', e.target.value)}/>${err.title && html`<span className="err">${err.title}</span>`}</div>
      <div className="stack g8"><span className="label">Kategorie</span>
        <div className="row g8 wrap" role="group" aria-label="Kategorie">${cats.map(c=> html`<button key=${c.id} className="chip" aria-pressed=${f.cat===c.id} onClick=${()=>set('cat', c.id)}><${Icon} n=${catIcon(c)} s=${16}/>${c.short}</button>`)}</div>
        ${err.cat && html`<span className="err">${err.cat}</span>`}
      </div>
      ${rental ? html`<div className="stack g8">
          <div style=${{ display:'grid', gridTemplateColumns:'repeat(2,minmax(0,1fr))', gap:10 }}>
            <div className="field"><label htmlFor="amt">Miete pro Tag</label>
              <label className="input row" style=${{ gap:4 }}><input id="amt" inputMode="decimal" placeholder="12" value=${f.amount} onChange=${e=>set('amount', e.target.value)} style=${{ border:'none', outline:'none', background:'transparent', width:'100%', fontFamily:'var(--font-display)', fontWeight:600, fontSize:18, color:'var(--accent)' }}/><span style=${{ fontWeight:600, color:'var(--accent)' }}>€</span></label></div>
            <div className="field"><label htmlFor="dep">Kaution <span className="muted" style=${{ fontWeight:400 }}>(optional)</span></label>
              <label className="input row" style=${{ gap:4 }}><input id="dep" inputMode="decimal" placeholder="50" value=${f.deposit} onChange=${e=>set('deposit', e.target.value)} style=${{ border:'none', outline:'none', background:'transparent', width:'100%', fontFamily:'var(--font-display)', fontWeight:600, fontSize:18 }}/><span style=${{ fontWeight:600 }}>€</span></label></div>
          </div>
          <span className="tiny muted">Die Kaution wird mit der Miete hinterlegt und kommt nach der Rückgabe automatisch zurück, wenn alles in Ordnung ist.</span>
          ${err.amount && html`<span className="err">${err.amount}</span>`}${err.deposit && html`<span className="err">${err.deposit}</span>`}
        </div>`
      : html`<div className="stack g8"><span className="label">Preis</span>
        <div className="row g10">
          <div className="seg grow" role="group" aria-label="Preisart">${[['Std.','pro Std.'],['pauschal','pauschal']].map(([v,t])=> html`<button key=${v} aria-pressed=${f.unit===v} onClick=${()=>set('unit', v)}>${t}</button>`)}</div>
          <label className="input row" style=${{ width:120, flex:'none', gap:4 }}><input id="amt" aria-label="Preis in Euro" inputMode="decimal" placeholder="15" value=${f.amount} onChange=${e=>set('amount', e.target.value)} style=${{ border:'none', outline:'none', background:'transparent', width:'100%', fontFamily:'var(--font-display)', fontWeight:600, fontSize:18, color:'var(--accent)' }}/><span style=${{ fontWeight:600, color:'var(--accent)' }}>€</span></label>
        </div>
        ${err.amount && html`<span className="err">${err.amount}</span>`}
      </div>`}
      <div className="field"><label htmlFor="d">Beschreibung</label><textarea id="d" className="input" maxLength="800" placeholder=${rental ? 'Zustand, Zubehör, Leistung, worauf man achten sollte' : 'Was machst du genau? Was bringst du mit? Wann hast du Zeit?'} value=${f.desc} onChange=${e=>set('desc', e.target.value)}></textarea>
        <span className="tiny muted" style=${{ alignSelf:'flex-end' }}>${f.desc.length} / 800</span>${err.desc && html`<span className="err">${err.desc}</span>`}</div>
      <div className="field"><label htmlFor="dist">Stadtteil</label><input id="dist" className="input" placeholder="z. B. Südviertel" value=${f.district} onChange=${e=>set('district', e.target.value)}/>
        <span className="tiny muted">Andere sehen nur den Stadtteil. Deine Adresse bleibt privat.</span>${err.district && html`<span className="err">${err.district}</span>`}</div>
      ${rental ? html`<div className="stack g8"><span className="label">Übergabe</span>
          <div className="row g8 wrap" role="group" aria-label="Übergabe">${Object.entries(HANDOVER).map(([v,t])=> html`<button key=${v} className="chip" aria-pressed=${f.handover===v} onClick=${()=>set('handover', v)}>${t}</button>`)}</div>
          ${f.handover!=='lieferung' && html`<div className="field"><label htmlFor="pa" className="small">Abholadresse</label><input id="pa" className="input" placeholder="Straße, Hausnummer" value=${f.pickupAddress} onChange=${e=>set('pickupAddress', e.target.value)}/>
            <span className="tiny muted">Sieht nur, wer gebucht und bezahlt hat.</span>${err.pickupAddress && html`<span className="err">${err.pickupAddress}</span>`}</div>`}
          <div className="field"><label htmlFor="md" className="small">Höchstens so viele Tage am Stück</label><select id="md" className="input" value=${f.maxDays} onChange=${e=>set('maxDays', parseInt(e.target.value,10))}>${[1,2,3,5,7,14].map(n=> html`<option key=${n} value=${n}>${n} ${n===1?'Tag':'Tage'}</option>`)}</select></div>
          <span className="tiny muted">Mieter:innen sehen einen Kalender mit allen freien Tagen. Gebuchte Tage werden automatisch blockiert.</span>
        </div>`
      : html`<div className="stack g8"><span className="label">Feste Zeiten <span className="muted" style=${{ fontWeight:400 }}>(optional)</span></span>
        <div className="panel">
          <${Switch} id="sw-sched" label="Zeitfenster angeben und direkt buchbar machen" sub="Kund:innen sehen deine freien Termine und buchen ohne Chat. So bekommst du keine Anfragen zu unpassenden Zeiten." on=${f.sched} onToggle=${()=>set('sched', !f.sched)}/>
          ${f.sched && html`<div className="stack g12" style=${{ padding:'0 14px 14px' }}>
            <div className="stack g8"><span className="small" style=${{ fontWeight:600 }}>An welchen Tagen?</span>
              <div className="row g6 wrap" role="group" aria-label="Wochentage">${WD_ORDER.map(d=> html`<button key=${d} className="chip" style=${{ minWidth:46, justifyContent:'center', padding:'0 10px' }} aria-pressed=${f.days.includes(d)} onClick=${()=>set('days', f.days.includes(d) ? f.days.filter(x=>x!==d) : [...f.days, d])}>${WD[d]}</button>`)}</div></div>
            <div style=${{ display:'grid', gridTemplateColumns:'repeat(3,minmax(0,1fr))', gap:8 }}>
              <div className="field"><label htmlFor="sf" className="small">Von</label><select id="sf" className="input" value=${f.from} onChange=${e=>set('from', parseInt(e.target.value,10))}>${Array.from({length:17},(_,i)=>i+6).map(h=> html`<option key=${h} value=${h}>${hh(h)}</option>`)}</select></div>
              <div className="field"><label htmlFor="st" className="small">Bis</label><select id="st" className="input" value=${f.to} onChange=${e=>set('to', parseInt(e.target.value,10))}>${Array.from({length:17},(_,i)=>i+7).map(h=> html`<option key=${h} value=${h}>${hh(h)}</option>`)}</select></div>
              <div className="field"><label htmlFor="sd" className="small">Dauer</label><select id="sd" className="input" value=${f.duration} onChange=${e=>set('duration', parseInt(e.target.value,10))}>${[1,2,3,4].map(h=> html`<option key=${h} value=${h}>${h} Std.</option>`)}</select></div>
            </div>
            ${f.days.length>0 && f.to - f.from >= f.duration && html`<span className="small muted">${scheduleText({ days:f.days, from:f.from, to:f.to })} · Startzeiten ${hh(f.from)} bis ${hh(f.to - f.duration)}${f.unit==='Std.' && amtN>0 ? ' · Preis pro Termin ' + money(amtN * f.duration) : ''}</span>`}
          </div>`}
        </div>
        ${err.sched && html`<span className="err">${err.sched}</span>`}
      </div>`}
      <div className="panel"><${Switch} id="sw-biz" label="Ich biete gewerblich an" sub="Zum Beispiel mit angemeldetem Gewerbe oder als Firma. Dann gelten für deine Kund:innen die Verbraucherrechte, etwa das Widerrufsrecht." on=${f.business} onToggle=${()=>set('business', !f.business)}/></div>
      <div className="stack g8"><span className="label">${rental ? 'Wer darf mieten?' : 'Wer darf dich anfragen?'}</span>
        <div className="panel">
          <${Switch} id="sw-req" label="Nur Personen mit geprüfter Identität" sub="Weniger Anfragen, aber mehr Sicherheit" on=${f.requireIdv} onToggle=${()=>set('requireIdv', !f.requireIdv)}/>
          <${Switch} id="sw-w" label="Nur Frauen (Frauen für Frauen)" sub=${canWomen ? 'Nur Frauen mit geprüfter Identität können anfragen' : 'Verfügbar für Frauen mit geprüfter Identität'} on=${f.womenOnly} disabled=${!canWomen} onToggle=${()=>set('womenOnly', !f.womenOnly)}/>
        </div>
      </div>
      ${blocked ? html`<div className="box b-danger" role="alert"><${Icon} n="ban"/><span><b>Dieses Inserat können wir nicht veröffentlichen.</b> Es enthält Inhalte, die bei Neighbr verboten sind, zum Beispiel Drogen, sexuelle Dienstleistungen oder Waffen. Bitte überarbeite den Text.</span></div>`
        : !editing && html`<div className="box b-butter"><${Icon} n="clock"/><span>Jedes Inserat wird vor der Veröffentlichung automatisch geprüft, zum Beispiel auf verbotene Angebote, Zahlung außerhalb der App oder Kontaktdaten. Unklare Fälle sieht sich unser Team an, meist innerhalb weniger Stunden.</span></div>`}
      <p className="tiny muted">Mit dem ${editing ? 'Speichern' : 'Veröffentlichen'} bestätigst du, dass dein Angebot erlaubt ist und den <button className="btn ghost" style=${{ display:'inline', height:'auto', width:'auto', padding:0, fontSize:12, textDecoration:'underline' }} onClick=${()=>openSheet('legal', { id:'agb' })}>Nutzungsbedingungen</button> entspricht.</p>
    </div></div>
    <div className="footer pad"><button className="btn" onClick=${submit}>${editing ? 'Änderungen speichern' : 'Zur Prüfung senden'}</button></div>
  </div>`;
}


function LinkBtn({ onClick, children }){
  return html`<button type="button" onClick=${e=>{ e.preventDefault(); e.stopPropagation(); onClick(); }} style=${{ border:'none', background:'none', padding:0, color:'var(--accent)', textDecoration:'underline', font:'inherit', cursor:'pointer' }}>${children}</button>`;
}

function NetBox({ s }){
  const n = s.net || {};
  if (n.status==='shared') return html`<div className="box b-mint" style=${{ alignItems:'flex-start' }}><${Icon} n="users"/><span><b>Gemeinsame Testwelt.</b> Inserate, Chats und Buchungen teilst du mit den anderen Tester:innen. Bitte gib keine echten Adressen oder Telefonnummern ein, eine ausgedachte Adresse reicht.</span></div>`;
  if (n.status==='readonly') return html`<div className="box b-butter" style=${{ alignItems:'flex-start' }}><${Icon} n="lock"/><span><b>Nur auf diesem Gerät.</b> Für die gemeinsame Testwelt fehlt dir die Berechtigung zum Mitschreiben. Alles, was du machst, bleibt in deinem Browser. Die anderen Personen sind Testfiguren.</span></div>`;
  if (n.status==='local') return html`<div className="box b-butter" style=${{ alignItems:'flex-start' }}><${Icon} n="lock"/><span><b>Nur auf diesem Gerät.</b> Alles, was du machst, bleibt in deinem Browser. Die anderen Personen sind Testfiguren.</span></div>`;
  return null;
}

    <div className="row g16">

      <div className="stack g6"><h1 className="title-l">${s.user.name}</h1>

        <span className="small muted">${s.user.reviewsReceived.length ? fmtAvg(s.user.reviewsReceived) + ' als Kund:in' : 'Noch keine Bewertungen als Kund:in'}</span>
      </div>
    </div>
    <div className="panel">
      <${Row} icon="shield" label="Sicherheit & Identität" sub=${s.user.idVerified ? 'Identität geprüft' + (s.user.trusted ? ' · Vertrauensperson: ' + s.user.trusted.name : '') : 'Identität noch nicht geprüft'} tone="mint" onClick=${()=>go({ name:'safety' })}/>
      <${Row} icon="list" label="Meine Inserate" sub=${mine.length ? mine.length + (mine.length===1?' Inserat':' Inserate') : 'Noch keine'} onClick=${()=>go({ name:'mylistings' })}/>
      <${Row} icon="wallet" label="Meine Aufträge" sub=${orders.length ? orders.length + (orders.length===1?' Auftrag':' Aufträge') : 'Noch keine'} tone="butter" onClick=${()=>go({ name:'orders' })}/>
      <${Row} icon="heart" label="Favoriten" sub=${s.favorites.length + ' gespeichert'} tone="peach" onClick=${()=>go({ name:'favs' })}/>
      <${Row} icon="ban" label="Blockierte Personen" sub=${s.blocked.length + ' blockiert'} tone="butter" onClick=${()=>openSheet('blocked')}/>

    <div className="panel"><${Row} icon="feedback" label="Feedback geben" sub="Was gefällt dir, was fehlt, was klemmt?" tone="peach" onClick=${()=>openSheet('feedback', { screen:screenName })}/></div>
    ${showAdmin && html`<div className="stack g8"><span className="eyebrow">${s.net && s.net.shared ? 'Betreiber-Ansicht (nur für dich sichtbar)' : 'Betreiber-Ansicht (nur in der Testversion sichtbar)'}</span>
      <div className="panel"><${Row} icon="shield" label="Moderation" sub=${s.feedback ? 'Feedback, Inserate, Meldungen, Streitfälle, Notfälle' : 'Inserate, Meldungen, Streitfälle, Notfälle'} tone="mint" badge=${queue} onClick=${()=>go({ name:'admin' })}/></div>

    <div className="panel">
      <${Row} icon="logout" label="Abmelden" sub=${'Angemeldet mit ' + s.user.phone} tone="lav" onClick=${()=>openSheet('logout')}/>
      <${Row} icon="refresh" label="Testdaten zurücksetzen" sub="Startet die Testversion neu" tone="butter" onClick=${()=>openSheet('reset')}/>

      <div className="panel">${LEGAL_ORDER.map(([k, t, ic]) => html`<${Row} key=${k} icon=${ic} label=${t} tone="lav" onClick=${()=>openSheet('legal', { id:k })}/>`)}</div>

function SafetyScreen({ s, act, back, openSheet, toast }){
  const u = s.user; const lvl = trustLevel(s);
  const [tn, setTn] = useState(u.trusted ? u.trusted.name : ''); const [tp, setTp] = useState(u.trusted ? u.trusted.phone : ''); const [terr, setTerr] = useState('');
  const isW = u.idVerified && u.gender==='w';
  const setSetting = (k, v) => act(st=>({ ...st, user:{ ...st.user, settings:{ ...st.user.settings, [k]:v } } }));
  function saveTrusted(){
    if (tn.trim().length < 2 || tp.replace(/\D/g,'').length < 8) { setTerr('Bitte gib Name und Handynummer der Person ein.'); return; }
    act(st=>({ ...st, user:{ ...st.user, trusted:{ name:tn.trim(), phone:tp.trim() } } })); setTerr(''); toast('Vertrauensperson gespeichert.', 'ok');
  }
  return html`<div className="screen"><${Header} title="Sicherheit & Identität" onBack=${back}/>
    <div className="pad stack g20" style=${{ paddingBlock:'4px 28px' }}>
      <div className=${'stack g10 ' + (u.idVerified ? 't-mint' : 't-sunk')} style=${{ borderRadius:24, padding:18 }}>
        <div className="row g12"><div className="tile" style=${{ width:48, height:48, borderRadius:16, background:'var(--surface)' }}><${Icon} n="id" s=${26}/></div>
          <div className="stack grow" style=${{ gap:2 }}><span className="title-m">${u.idVerified ? 'Identität geprüft' : 'Identität nicht geprüft'}</span><span className="small">Vertrauensstufe: ${lvl.label} · bis zu ${lvl.limit} neue Anfragen am Tag</span></div></div>
        ${!u.idVerified && html`<button className="btn sm" style=${{ width:'100%' }} onClick=${()=>openSheet('idcheck')}>Identität jetzt prüfen</button>`}
        ${u.idVerified && html`<span className="small">Andere sehen das grüne Schild bei deinem Namen. Deine Ausweisdaten selbst sieht niemand.</span>`}
      </div>

      <div className="stack g8"><span className="eyebrow">Vertrauensperson</span>
        <div className="panel stack g12" style=${{ padding:14 }}>
          <span className="small muted">Diese Person kannst du bei jedem Termin informieren. Sie sieht Check-in, Check-out und bekommt Bescheid, wenn etwas nicht stimmt.</span>
          <div className="field"><label htmlFor="tn">Name</label><input id="tn" className="input" value=${tn} onChange=${e=>{ setTn(e.target.value); setTerr(''); }} placeholder="z. B. Mama, Jana"/></div>
          <div className="field"><label htmlFor="tp">Handynummer</label><input id="tp" className="input" inputMode="tel" value=${tp} onChange=${e=>{ setTp(e.target.value); setTerr(''); }} placeholder="0151 2345678"/></div>
          ${terr && html`<p className="err" role="alert">${terr}</p>`}
          <button className="btn outline sm" style=${{ width:'100%' }} onClick=${saveTrusted}>${u.trusted ? 'Aktualisieren' : 'Speichern'}</button>
        </div>
      </div>

      <div className="stack g8"><span className="eyebrow">Wer darf mich anfragen?</span>
        <div className="panel">
          <${Switch} id="s-idv" label="Nur Personen mit geprüfter Identität" sub="Gilt für alle deine Inserate" on=${u.settings.onlyIdvRequests} onToggle=${()=>setSetting('onlyIdvRequests', !u.settings.onlyIdvRequests)}/>
          <${Switch} id="s-wr" label="Nur Anfragen von Frauen" sub=${isW ? 'Nur Frauen mit geprüfter Identität können dich anfragen' : 'Verfügbar für Frauen mit geprüfter Identität'} on=${u.settings.onlyWomenRequests} disabled=${!isW} onToggle=${()=>setSetting('onlyWomenRequests', !u.settings.onlyWomenRequests)}/>
        </div>
      </div>
      <div className="stack g8"><span className="eyebrow">Was sehe ich?</span>
        <div className="panel">
          <${Switch} id="s-wp" label="Nur Angebote von Frauen anzeigen" sub=${isW ? 'Gilt für Entdecken und die Suche' : 'Verfügbar für Frauen mit geprüfter Identität'} on=${u.settings.onlyWomenProviders} disabled=${!isW} onToggle=${()=>setSetting('onlyWomenProviders', !u.settings.onlyWomenProviders)}/>
          <${Switch} id="s-oi" label="Nur geprüfte Anbieter:innen anzeigen" sub="Blendet Konten ohne Identitätscheck aus" on=${s.onlyIdv} onToggle=${()=>act(st=>({ ...st, onlyIdv:!st.onlyIdv }))}/>
        </div>
      </div>

      <div className="stack g8"><span className="eyebrow">Bewertungen über dich</span>
        ${u.reviewsReceived.length===0 ? html`<p className="small muted">Nach deinem ersten Auftrag bewertet dich die andere Person auch. Gute Bewertungen öffnen dir mehr Türen.</p>`
          : u.reviewsReceived.map(r=> html`<div key=${r.id} className="panel stack g4" style=${{ padding:14 }}><div className="row g8"><${Stars} n=${r.stars}/><span className="small muted">${r.by}</span></div>${r.text && html`<p className="small" style=${{ color:'var(--ink-2)' }}>${r.text}</p>`}</div>`)}
      </div>

      <div className="stack g8"><span className="eyebrow">So bleibst du sicher</span>
        <div className="panel stack g10" style=${{ padding:16 }}>
          ${[['wallet','Bezahl immer über die App. Nur dann bist du abgesichert.'],['share','Teile Termine mit deiner Vertrauensperson.'],['login','Macht beim Treffen beide den Check-in.'],['users','Du darfst jederzeit jemanden dazuholen. Gib es beim Bezahlen an.'],['ban','Fühlt sich etwas falsch an, brich ab. Du bekommst dein Geld zurück, wenn der Termin nicht stattfindet.'],['sos','In Gefahr? Ruf die 110 an. Der Notfallknopf im Termin zeigt dir die Nummer.']].map(([ic,t])=> html`<div key=${t} className="row g10" style=${{ alignItems:'flex-start' }}><span style=${{ color:'var(--accent)', flex:'none' }}><${Icon} n=${ic} s=${20}/></span><span className="small">${t}</span></div>`)}

      </div>
      <div className="box b-butter"><${Icon} n="alert"/><span>Hinweis für den Testbetrieb: Die Frauen-Optionen müssen vor dem Release rechtlich geprüft werden (Gleichbehandlungsgesetz). Der Identitätscheck mit Selfie verarbeitet biometrische Daten und braucht eine ausdrückliche Einwilligung.</span></div>
    </div></div>`;
}

function MyListings({ s, back, go, act, simBooking, openSheet }){
  const mine = s.listings.filter(l=>l.mine);
  const pill = st => st==='live' ? html`<span className="pill p-mint">Online</span>` : st==='review' ? html`<span className="pill p-butter">In Prüfung</span>` : st==='paused' ? html`<span className="pill p-sunk">Pausiert</span>` : html`<span className="pill p-danger">Abgelehnt</span>`;
  const prov = s.orders.filter(o=>o.role==='provider');
  const held = prov.filter(o=>o.status==='held'||o.status==='due').reduce((a,o)=>a+o.amount,0);
  const paid = (s.payoutBase||0) + prov.filter(o=>o.status==='released').reduce((a,o)=>a+o.amount,0);
  const upcoming = prov.filter(o=>o.status==='held').length;
  const WDS = last7().map(k=>{ const [y,m,d] = k.split('-').map(Number); return WD[new Date(y, m-1, d).getDay()]; });
  return html`<div className="screen"><${Header} title="Meine Inserate" onBack=${back}/>
    <div className="pad stack g16" style=${{ paddingBlock:'4px 24px' }}>
      <div className="panel stack g12" style=${{ padding:16 }}>
        <span className="eyebrow">Dein Guthaben</span>
        <div style=${{ display:'grid', gridTemplateColumns:'repeat(2,minmax(0,1fr))', gap:12 }}>
          <div className="stack g4"><span className="small muted">Hinterlegt</span><span className="price" style=${{ fontSize:24 }}>${money(held)}</span><span className="tiny muted">${upcoming} ${upcoming===1?'Termin':'Termine'} offen</span></div>
          <div className="stack g4"><span className="small muted">Ausgezahlt</span><span className="price" style=${{ fontSize:24, color:'var(--mint-ink)' }}>${money(paid)}</span><span className="tiny muted">auf dein Bankkonto</span></div>
        </div>
        ${prov.length>0 && html`<button className="btn outline sm" style=${{ width:'100%' }} onClick=${()=>go({ name:'orders' })}>Aufträge ansehen</button>`}
      </div>
      ${mine.length===0 && html`<div className="empty"><p style=${{ fontWeight:600 }}>Du hast noch nichts inseriert</p><p className="small muted">Tippe unten auf das Plus, um deine erste Leistung anzubieten.</p></div>`}
      ${mine.map(l=>{ const st = l.stats || { views:0, favs:0, requests:0, bookings:0, week:[0,0,0,0,0,0,0] }; const max = Math.max(1, ...st.week);
        const reqs = s.threads.filter(t=>t.listingId===l.id && t.role==='provider').length;
        const free = l.schedule ? slotsFor(l, 14).reduce((a,d)=>a+d.free,0) : 0;
        return html`<div key=${l.id} className="panel stack g12" style=${{ padding:14 }}>
        <div className="row g12"><${Tile} l=${l} size=${60} r=${14}/><div className="stack g4 grow"><span style=${{ fontWeight:600, lineHeight:1.3 }}>${l.title}</span><div className="row g8 wrap">${pill(l.status)}<span className="small muted">${priceText(l.price)}</span>${l.reviews.length>0 && html`<span className="small muted">${fmtRating(l)}</span>`}</div>
          <div className="row g6 wrap">${l.provider.requireIdv && html`<span className="pill p-mint" style=${{ fontSize:11, padding:'2px 7px' }}>Nur geprüfte Kunden</span>`}${l.provider.womenOnly && html`<span className="pill p-peach" style=${{ fontSize:11, padding:'2px 7px' }}>Frauen für Frauen</span>`}</div></div></div>
        ${l.status==='live' && html`<${React.Fragment}><div style=${{ display:'grid', gridTemplateColumns:'repeat(4,minmax(0,1fr))', gap:8 }}>
          ${[['eye','Aufrufe',st.views],['heart','Gemerkt',st.favs],['chat','Anfragen',st.requests + reqs],['check','Buchungen',st.bookings]].map(([ic,lab,v])=> html`<div key=${lab} className="stack g4" style=${{ background:'var(--sunk)', borderRadius:14, padding:'10px 8px', alignItems:'center' }}>
            <span className="muted"><${Icon} n=${ic} s=${16}/></span><span style=${{ fontFamily:'var(--font-display)', fontWeight:600, fontSize:20, fontVariantNumeric:'tabular-nums' }}>${v}</span><span className="tiny muted">${lab}</span></div>`)}
        </div>
        <div className="stack g6"><span className="small muted">Aufrufe der letzten 7 Tage</span>
          <div className="row g6" style=${{ alignItems:'flex-end', height:56 }} role="img" aria-label=${'Aufrufe pro Tag: ' + st.week.join(', ')}>
            ${st.week.map((v,i)=> html`<div key=${i} className="stack g4 grow" style=${{ alignItems:'center' }}><div style=${{ width:'100%', maxWidth:28, height: Math.max(3, Math.round(v/max*40)), borderRadius:6, background: i===6 ? 'var(--accent)' : 'var(--lav)' }}></div><span className="tiny muted">${WDS[i]}</span></div>`)}
          </div></div><//>`}
        ${l.schedule && html`<div className="box b-lav" style=${{ alignItems:'center' }}><${Icon} n="clock"/><span className="grow">${scheduleText(l.schedule)} · ${free} freie Termine in den nächsten 2 Wochen</span></div>`}
        ${isRental(l) && html`<div className="box b-lav" style=${{ alignItems:'center' }}><${Icon} n="calendar"/><span className="grow">${freeRentDays(l, 14).length} von 14 Tagen frei · ${HANDOVER[(l.rent && l.rent.handover) || 'abholung']}${l.deposit ? ' · ' + money(l.deposit) + ' Kaution' : ''}</span></div>`}
        ${l.status==='live' && (l.schedule || isRental(l)) && !l._sh && html`<button className="testbtn" onClick=${()=>simBooking(l.id)}><${Icon} n="fast" s=${18}/>${isRental(l) ? 'Testmodus: Jemand mietet und bezahlt' : 'Testmodus: Jemand bucht einen freien Termin und bezahlt'}</button>`}
        ${l.status==='rejected' && html`<p className="small" style=${{ color:'var(--danger)' }}>Grund: ${l.rejectReason || 'Verstößt gegen die Regeln.'}</p>`}
        ${l.status==='review' && l.flag && html`<div className="box b-butter"><${Icon} n="alert"/><span>Unser Team prüft dein Inserat von Hand. Aufgefallen ist: ${l.flag}. Tipp: Zahlungen und Kontakt laufen immer über Neighbr, dann geht es schneller.</span></div>`}
        <div className="row g8">
          ${l.status!=='rejected' && html`<button className="btn sm grow" onClick=${()=>go({ name:'edit', id:l.id })}><${Icon} n="edit" s=${16}/>${l.schedule ? 'Bearbeiten & Zeiten' : 'Bearbeiten'}</button>`}
          ${l.status==='rejected' && html`<button className="btn sm grow" onClick=${()=>go({ name:'edit', id:l.id })}><${Icon} n="edit" s=${16}/>Überarbeiten</button>`}
          ${l.status==='live' && html`<button className="btn outline sm grow" onClick=${()=>go({ name:'listing', id:l.id })}>Ansehen</button>`}
        </div>
        <div className="row g8">
          ${l.status==='live' && html`<button className="btn outline sm grow" onClick=${()=>act(st=>({ ...st, listings: st.listings.map(x=>x.id===l.id?{ ...x, status:'paused' }:x) }))}>Pausieren</button>`}
          ${l.status==='paused' && html`<button className="btn outline sm grow" onClick=${()=>act(st=>({ ...st, listings: st.listings.map(x=>x.id===l.id?{ ...x, status:'live' }:x) }))}>Wieder online</button>`}
          <button className="btn danger sm grow" style=${{ height:42 }} onClick=${()=>openSheet('dellisting', { id:l.id })}>Löschen</button>
        </div>
      </div>`; })}
    </div></div>`;
}

function Orders({ s, back, go }){
  const list = [...s.orders].sort((a,b)=>b.createdAt-a.createdAt);
  const label = { held:['Hinterlegt','p-mint'], due:['Bitte bestätigen','p-butter'], released:['Abgeschlossen','p-lav'], disputed:['In Prüfung','p-danger'], refunded:['Erstattet','p-sunk'] };
  return html`<div className="screen"><${Header} title="Meine Aufträge" onBack=${back}/>
    <div className="pad stack g12" style=${{ paddingBlock:'4px 24px' }}>
      ${list.length===0 && html`<div className="empty"><p style=${{ fontWeight:600 }}>Noch keine Aufträge</p><p className="small muted">Sobald du ein Angebot annimmst oder jemand deins annimmt, siehst du es hier.</p></div>`}
      ${list.length>0 && html`<div className="panel">${list.map(o=> html`<button key=${o.id} className="listrow" onClick=${()=>go({ name:'order', id:o.id })}>
        <${Avatar} name=${o.otherName} size=${44} tone=${o.role==='buyer'?'peach':'mint'}/>
        <div className="stack grow" style=${{ gap:2 }}><span className="ell" style=${{ fontWeight:600 }}>${o.title}</span><span className="small muted">${o.kind==='rental' ? (o.role==='buyer' ? 'Du mietest bei ' : 'Du vermietest an ') : (o.role==='buyer' ? 'Du buchst ' : 'Du hilfst ')}${o.otherName} · ${o.dateText}</span></div>
        <div className="stack g4" style=${{ alignItems:'flex-end' }}><span className="price" style=${{ fontSize:15 }}>${money(o.amount)}</span><span className=${'pill ' + label[o.status][1]} style=${{ padding:'2px 7px', fontSize:11 }}>${o.status==='held' && o.phase==='checkedin' ? 'Läuft' : label[o.status][0]}</span></div>
      </button>`)}</div>`}
    </div></div>`;

function Admin({ s, act, back, toast, notify, feedbackDone }){
  const pending = s.listings.filter(l=>l.status==='review');
  const reports = s.reports.filter(r=>r.status==='open');
  const disputes = (s.allOrders || s.orders).filter(o=>o.status==='disputed');
  const fbOpen = (s.feedback || []).filter(f=>f.status!=='done'); const fbDone = (s.feedback || []).filter(f=>f.status==='done');
  const setOrder = (id, status) => act(st=>{ const f = x=>x.id===id ? { ...x, status } : x; return { ...st, orders: st.orders.map(f), ...(st.allOrders ? { allOrders: st.allOrders.map(f) } : {}) }; });
  const FB = { gut:['Gefällt mir','p-mint'], idee:['Idee','p-lav'], problem:['Problem','p-danger'] };
  const when = t => { const d = new Date(t); return pad2(d.getDate()) + '.' + pad2(d.getMonth()+1) + '. ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  const alerts = s.alerts.filter(a=>a.status==='open');
  const decide = (id, ok) => {
    const l = s.listings.find(x=>x.id===id);
    act(st=>({ ...st, listings: st.listings.map(x=>x.id===id?{ ...x, status: ok?'live':'rejected', rejectReason: ok?null:'Verstößt gegen die Regeln.' }:x),
      reports: ok ? st.reports.map(r=>r.listingId===id && r.status==='open' ? { ...r, status:'dismissed' } : r) : st.reports }));
    if (l && l.mine) notify(ok ? 'Dein Inserat „' + l.title + '“ ist jetzt online.' : 'Dein Inserat „' + l.title + '“ wurde abgelehnt.');
    toast(ok ? 'Freigegeben' : 'Abgelehnt', 'ok');
  };
  const Section = ({ title, n, children, tone }) => html`<div className="stack g10"><div className="row g8"><h2 className="title-m grow">${title}</h2><span className=${'pill ' + (tone && n ? tone : 'p-sunk')}>${n}</span></div>${n===0 ? html`<p className="small muted">Nichts zu tun.</p>` : children}</div>`;
  return html`<div className="screen"><${Header} title="Moderation" onBack=${back}/>
    <div className="pad stack g20" style=${{ paddingBlock:'4px 24px' }}>
      <div className="box b-lav"><${Icon} n="shield"/><span>Diese Ansicht sehen später nur du und dein Team. Notfälle zuerst, dann Streitfälle, dann der Rest. Zielzeit für Meldungen: 24 Stunden.</span></div>
      ${s.feedback && html`<${Section} title="Feedback von Tester:innen" n=${fbOpen.length} tone="p-lav">
        ${fbOpen.map(f=> html`<div key=${f.id} className="panel stack g8" style=${{ padding:14 }}>
          <div className="row g6 wrap"><span className=${'pill ' + (FB[f.kind] || FB.idee)[1]}>${(FB[f.kind] || FB.idee)[0]}</span><span className="small" style=${{ fontWeight:600 }}>${f.name || 'Jemand'}</span><span className="tiny muted">${f.screen ? 'bei ' + f.screen + ' · ' : ''}${f.at ? when(f.at) : ''}</span></div>
          <p className="small" style=${{ color:'var(--ink-2)', whiteSpace:'pre-wrap' }}>${f.text}</p>
          <button className="btn outline sm" style=${{ width:'100%' }} onClick=${()=>{ feedbackDone(f.id); toast('Als erledigt markiert', 'ok'); }}>Erledigt</button>
        </div>`)}
        ${fbDone.length>0 && html`<p className="tiny muted">${fbDone.length} erledigt</p>`}
      <//>`}
      <${Section} title="Notfälle" n=${alerts.length} tone="p-danger">
        ${alerts.map(a=> html`<div key=${a.id} className="panel stack g8" style=${{ padding:14, borderColor:'var(--danger-line)' }}>
          <span className="row g6" style=${{ fontWeight:600, color:'var(--danger)' }}><${Icon} n="sos" s=${18}/>${a.kind}</span>
          <span className="small">${a.text}</span><span className="tiny muted">${a.time} Uhr</span>
          <button className="btn outline sm" style=${{ width:'100%' }} onClick=${()=>{ act(st=>({ ...st, alerts: st.alerts.map(x=>x.id===a.id?{ ...x, status:'done' }:x) })); toast('Als bearbeitet markiert', 'ok'); }}>Kontakt aufgenommen, erledigt</button>
        </div>`)}
      <//>
      <${Section} title="Inserate zur Prüfung" n=${pending.length}>
        ${pending.map(l=> html`<div key=${l.id} className="panel stack g10" style=${{ padding:14 }}>
          <div className="row g12"><${Tile} l=${l} size=${52} r=${14}/><div className="stack g4 grow"><span style=${{ fontWeight:600 }}>${l.title}</span><span className="small muted">${l.provider.name} · ${priceText(l.price)}</span></div></div>
          <p className="small" style=${{ color:'var(--ink-2)' }}>${l.desc}</p>
          ${l.flag && html`<span className="pill p-butter" style=${{ alignSelf:'flex-start', whiteSpace:'normal' }}><${Icon} n="alert" s=${14}/>${l.flag}</span>`}
          <div className="row g8"><button className="btn sm grow" onClick=${()=>decide(l.id, true)}>Freigeben</button><button className="btn danger sm grow" style=${{ height:42 }} onClick=${()=>decide(l.id, false)}>Ablehnen</button></div>
        </div>`)}
      <//>
      <${Section} title="Meldungen" n=${reports.length}>
        ${reports.map(r=>{ const l = s.listings.find(x=>x.id===r.listingId); return html`<div key=${r.id} className="panel stack g8" style=${{ padding:14 }}>
          <span style=${{ fontWeight:600 }}>${l ? l.title : 'Gelöschtes Inserat'}</span>
          <div className="row g6 wrap"><span className="pill p-danger">${r.reason}</span><span className="tiny muted">von ${r.by || 'dir'}</span></div>
          ${r.note && html`<p className="small" style=${{ color:'var(--ink-2)' }}>„${r.note}“</p>`}
          <div className="row g8">
            <button className="btn outline sm grow" onClick=${()=>{ act(st=>({ ...st, reports: st.reports.map(x=>x.id===r.id?{ ...x, status:'dismissed' }:x) })); toast('Meldung geschlossen', 'ok'); }}>Kein Verstoß</button>
            <button className="btn danger sm grow" style=${{ height:42 }} onClick=${()=>{ act(st=>({ ...st, reports: st.reports.map(x=>x.listingId===r.listingId && x.status==='open'?{ ...x, status:'done' }:x), listings: st.listings.map(x=>x.id===r.listingId?{ ...x, status:'rejected', rejectReason:'Nach Meldungen entfernt.' }:x) })); toast('Inserat entfernt', 'ok'); }}>Inserat entfernen</button>
          </div>
        </div>`; })}
      <//>
      <${Section} title="Streitfälle" n=${disputes.length}>
        ${disputes.map(o=> html`<div key=${o.id} className="panel stack g8" style=${{ padding:14 }}>
          <span style=${{ fontWeight:600 }}>${o.title}</span>
          <span className="small muted">${o.buyerName ? o.buyerName + ' (Kund:in) gegen ' + o.providerName : o.role==='buyer' ? s.user.name + ' (Kund:in) gegen ' + o.otherName : o.otherName + ' (Kund:in) gegen ' + s.user.name} · ${money(o.amount)}</span>
          <span className="pill p-danger" style=${{ alignSelf:'flex-start' }}>${o.dispute.reason}</span>
          ${o.dispute.note && html`<p className="small" style=${{ color:'var(--ink-2)' }}>„${o.dispute.note}“</p>`}
          <span className="tiny muted">Check-in: ${o.checkinAt ? o.checkinAt + ' Uhr' : 'keiner'} · Check-out: ${o.phase==='checkedout' ? 'ja' : 'nein'}</span>
          <div className="row g8">
            <button className="btn outline sm grow" onClick=${()=>{ setOrder(o.id, 'refunded'); notify('Streitfall entschieden: ' + money(o.amount) + ' gehen zurück an die Kundin oder den Kunden.'); }}>Geld zurück</button>
            <button className="btn sm grow" onClick=${()=>{ setOrder(o.id, 'released'); notify('Streitfall entschieden: ' + money(o.amount) + ' werden ausgezahlt.'); }}>Auszahlen</button>
          </div>
        </div>`)}
      <//>
    </div></div>`;
}

const LEGAL_ORDER = [['sicherheit','Sicherheit & Haftung','shield'],['agb','Nutzungsbedingungen (AGB)','list'],['datenschutz','Datenschutzerklärung','lock'],['impressum','Impressum','home']];
function LegalBody({ id, openLegal }){
  const doc = LEGAL[id] || LEGAL.agb;
  const fill = t => t.split(/(\[[^\]]+\])/g).map((part, i) => /^\[.*\]$/.test(part) ? html`<mark key=${i} style=${{ background:'var(--butter)', color:'var(--butter-ink)', borderRadius:4, padding:'0 3px' }}>${part}</mark>` : part);
  return html`<div className="stack g16" style=${{ paddingBottom:8 }}>
    <div className="box b-butter"><${Icon} n="alert"/><span>Entwurf, Stand ${LEGAL_STAND}. Gelb markierte Platzhalter vor dem Release ausfüllen und die Texte rechtlich prüfen lassen.</span></div>
    ${doc.sections.map((sec, i) => html`<section key=${i} className="stack g8">
      ${sec.h && html`<h3 className="title-m" style=${{ fontSize:17 }}>${sec.h}</h3>`}
      ${(sec.p || []).map((t, j) => html`<p key=${j} style=${{ color:'var(--ink-2)', lineHeight:1.6, fontSize:14 }}>${fill(t)}</p>`)}
      ${sec.list && html`<ul style=${{ margin:0, paddingLeft:20, display:'flex', flexDirection:'column', gap:6, color:'var(--ink-2)', fontSize:14, lineHeight:1.55 }}>${sec.list.map((t, j) => html`<li key=${j}>${fill(t)}</li>`)}</ul>`}
      ${(sec.after || []).map((t, j) => html`<p key=${'a'+j} style=${{ color:'var(--ink-2)', lineHeight:1.6, fontSize:14 }}>${fill(t)}</p>`)}
    </section>`)}
    ${openLegal && html`<div className="row g8 wrap" style=${{ paddingTop:8, borderTop:'1.5px solid var(--line)' }}>
      ${LEGAL_ORDER.filter(([k]) => k!==id).map(([k, t]) => html`<button key=${k} className="chip" style=${{ height:36, fontSize:13 }} onClick=${()=>openLegal(k)}>${t}</button>`)}
    </div>`}
  </div>`;
}
